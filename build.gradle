plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the Minecraft, Fabric and library repositories automatically.
	// Only add repositories here when depending on other mods.
}

loom {
	splitEnvironmentSourceSets()
	accessWidenerPath = file("src/main/resources/thesift.classtweaker")

	mods {
		"thesift" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	// Datagen runs inside the client (models are client-side in 26.3), so it needs a display:
	// use tools/dev/datagen.sh, which wraps it in xvfb (D-019).
	configureDataGeneration {
		client = true
	}
	// Server GameTests live in their own source set so they never ship in the jar (D-019).
	configureTests {
		createSourceSet = true
		modId = "thesift-gametest"
		// Client GameTests take preview screenshots; run them with tools/dev/client-previews.sh (needs Xvfb).
		enableClientGameTests = true
	}
}

dependencies {
	// Versions live in gradle.properties (pinned by docs/DECISIONS.md D-001).
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
	// Surface every warning from our own code (mission §7.2: no new warnings).
	it.options.compilerArgs += ["-Xlint:all", "-Xlint:-classfile"]
	// -classfile: silences notes about annotation attributes inside library jars (JOML), not our code.
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
	from("LICENSE-ASSETS.md") {
		rename { "LICENSE-ASSETS_${projectName}.md" }
	}
}
