---
# Minimal Roblox globals for selene. The full Roblox std cannot be generated
# from this environment; tools/check_api.py validates Roblox API usage
# (classes, enums, properties, methods) against the real API dump instead.
base: luau
name: roblox_lite
globals:
  game:
    any: true
  workspace:
    any: true
  script:
    any: true
  Instance:
    any: true
  Vector3:
    any: true
  Vector2:
    any: true
  CFrame:
    any: true
  Color3:
    any: true
  UDim:
    any: true
  UDim2:
    any: true
  Enum:
    any: true
  RaycastParams:
    any: true
  OverlapParams:
    any: true
  TweenInfo:
    any: true
  NumberSequence:
    any: true
  NumberSequenceKeypoint:
    any: true
  ColorSequence:
    any: true
  ColorSequenceKeypoint:
    any: true
  NumberRange:
    any: true
  Random:
    any: true
  Font:
    any: true
  task:
    any: true
  warn:
    any: true
  tick:
    any: true
  time:
    any: true
