<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Second Guess</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
/* ---------- Shared game kit: layout shell, controls, overlays ----------
   Each game sets its own palette and fonts by overriding these tokens on :root. */
:root{
  --bg:#101318; --bg-2:#161a21; --surface:#1d222b; --surface-2:#262c37; --line:#343b48;
  --ink:#eef1f5; --muted:#a3abb8; --accent:#f2c14e; --accent-ink:#17130a;
  --good:#47d18c; --bad:#ff6b5e; --p1:#5aa2ff; --p2:#ff6b5e;
  --font-display:system-ui,sans-serif; --font-body:system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:16px; --radius-sm:10px;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
  color-scheme:dark;
}
[hidden]{display:none !important}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg);-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}

/* ---------- Title screen ---------- */
.title-screen{overflow-y:auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:20px 28px;align-items:center}
.title-inner{width:100%;max-width:460px;display:flex;flex-direction:column;gap:20px;margin:auto 0}
.title-art{display:flex;justify-content:center}
.title-art svg{width:min(70vw,260px);height:auto}
.title-name{font-family:var(--font-display);font-size:clamp(2.3rem,9vw,3.3rem);line-height:.98;margin:0;text-align:center;letter-spacing:-.01em}
.title-tag{color:var(--muted);text-align:center;margin:0;font-size:1.02rem}
.opt-group{display:flex;flex-direction:column;gap:7px}
.opt-label{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--bg-2);border:1px solid var(--line);border-radius:14px}
.seg button{border:0;background:transparent;border-radius:10px;padding:10px 6px;min-height:44px;font-weight:650;font-size:.95rem;color:var(--muted);line-height:1.15}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 2px 8px rgba(0,0,0,.25)}
.opt-note{font-size:.86rem;color:var(--muted);margin:0}
.title-actions{display:flex;flex-direction:column;gap:10px;margin-top:4px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:1rem;line-height:1.1;transition:transform .08s, background .15s, border-color .15s, opacity .15s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent}
.btn-danger{background:var(--bad);border-color:var(--bad);color:#160807}
.btn-sm{min-height:38px;padding:7px 14px;font-size:.9rem}
.btn-wide{width:100%}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;flex:none}
.icon-btn svg{width:22px;height:22px}

/* ---------- Game screen frame ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:10px var(--gutter-r) 8px var(--gutter-l);min-height:60px}
.topbar .status{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.topbar .status-main{font-family:var(--font-display);font-size:1.15rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .status-sub{font-size:.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:4px var(--gutter-r) 4px var(--gutter-l)}
.stage > svg, .stage > .board{max-width:100%;max-height:100%}
.actionbar{padding:8px var(--gutter-r) 12px var(--gutter-l);display:flex;flex-direction:column;gap:8px}
.action-row{display:flex;gap:8px;align-items:stretch}
.action-row > *{flex:1}
.hint-line{font-size:.9rem;color:var(--muted);text-align:center;min-height:1.3em;margin:0}

/* ---------- Overlays ---------- */
.cover{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  padding:24px var(--gutter-r) 24px var(--gutter-l);background:var(--bg);animation:kit-fade .18s ease-out}
.cover .cover-badge{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:2px solid var(--line)}
.cover .cover-badge svg{width:42px;height:42px}
.cover h2{font-family:var(--font-display);font-size:clamp(1.9rem,8vw,2.6rem);margin:0;line-height:1.05}
.cover p{margin:0;color:var(--muted);max-width:32ch}
.cover .btn{margin-top:10px;min-width:220px}
.modal-wrap{position:absolute;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,6,10,.62);animation:kit-fade .15s ease-out}
@media (min-width:640px){ .modal-wrap{align-items:center} }
.modal{width:100%;max-width:560px;max-height:88%;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.4);animation:kit-rise .2s ease-out}
@media (min-width:640px){ .modal{border-radius:22px} }
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 18px 8px}
.modal-head h2{flex:1;margin:0;font-family:var(--font-display);font-size:1.45rem;line-height:1.1}
.modal-body{padding:6px 18px 12px;overflow-y:auto;min-height:0;user-select:text;-webkit-user-select:text}
.modal-actions{display:flex;flex-direction:column;gap:8px;padding:10px 18px calc(16px + env(safe-area-inset-bottom, 0px))}
.banner{position:absolute;left:0;right:0;top:38%;z-index:45;display:flex;flex-direction:column;align-items:center;pointer-events:none;text-align:center;padding:0 var(--gutter-r) 0 var(--gutter-l)}
.banner-text{font-family:var(--font-display);font-size:clamp(2.6rem,13vw,4.6rem);line-height:1;padding:10px 22px;border-radius:18px;color:var(--ink);text-shadow:0 4px 24px rgba(0,0,0,.55);animation:kit-pop .9s cubic-bezier(.2,.9,.3,1.3) both}
.banner-sub{margin-top:8px;font-weight:700;color:var(--ink);background:rgba(0,0,0,.55);padding:6px 12px;border-radius:999px;animation:kit-fade .3s .15s both}
.banner.tone-good .banner-text{color:var(--good)}
.banner.tone-bad .banner-text{color:var(--bad)}
.banner.tone-accent .banner-text{color:var(--accent)}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:46;max-width:calc(100% - 32px);padding:9px 16px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:650;font-size:.94rem;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:kit-drop .2s ease-out;text-align:center}
.shake{animation:kit-shake .38s linear}
@keyframes kit-fade{from{opacity:0}to{opacity:1}}
@keyframes kit-rise{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes kit-drop{from{transform:translate(-50%,-10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes kit-pop{0%{transform:scale(.4);opacity:0}25%{transform:scale(1.08);opacity:1}75%{transform:scale(1);opacity:1}100%{transform:scale(1.02);opacity:0}}
@keyframes kit-shake{0%,100%{transform:none}20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,2px)}}
@media (prefers-reduced-motion: reduce){
  .banner-text{animation-duration:.01s}
  .shake{animation:none}
}

/* ---------- Rules text ---------- */
.rules h3{font-family:var(--font-display);font-size:1.15rem;margin:16px 0 6px}
.rules h3:first-child{margin-top:4px}
.rules p{margin:0 0 8px;color:var(--ink)}
.rules ul,.rules ol{margin:0 0 10px;padding-left:1.2em;display:flex;flex-direction:column;gap:5px}
.rules li::marker{color:var(--muted)}
.rules .tip{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:.92rem}
.rules b{color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0 0 10px;align-items:start}
.kv dt{font-weight:750;white-space:nowrap}
.kv dd{margin:0;color:var(--muted)}
.result-stats{display:grid;grid-template-columns:1fr auto;gap:6px 16px;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.result-stats span:nth-child(even){font-weight:750;text-align:right}

/* Second Guess: a field map in daylight. Ink lines, blue against red, gold control points. */
:root{
  --bg:#ece4d3; --bg-2:#e3d9c4; --surface:#f6f1e6; --surface-2:#e7dcc6; --line:#cbbd9f;
  --ink:#1f1d1a; --muted:#6c6253; --accent:#1f1d1a; --accent-ink:#f6f1e6;
  --good:#2f8f5b; --bad:#c43b30;
  --blue:#2f5fd0; --red:#cf3e33; --gold:#d79a17; --tile:#f2ead9; --tile-2:#ebe1cc; --wallc:#8c7b5c; --wall-top:#a8977a;
  --font-display:"Saira Stencil One","Impact","Arial Black",sans-serif;
  --font-body:"Archivo","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
body{background:var(--bg)}
.title-name{font-weight:400;letter-spacing:.02em}
.title-name .r{color:var(--red)}
.title-name .b{color:var(--blue)}
.seg{background:var(--bg-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(60,40,10,.18)}
.btn{background:var(--surface)}
.btn-primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.modal{background:var(--surface)}
.modal-wrap{background:rgba(40,30,15,.45)}
.cover{background:var(--bg)}
.toast{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.banner-text{text-shadow:0 3px 16px rgba(255,255,255,.7)}
.banner.tone-accent .banner-text{color:var(--ink)}
.banner-sub{background:rgba(31,29,26,.82);color:#fff}
.topbar .status-main{font-weight:800}
.scores{display:flex;gap:6px;flex:none}
.chip{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:800;font-size:.95rem;font-variant-numeric:tabular-nums}
.chip i{width:10px;height:10px;border-radius:3px;display:block}
.chip small{font-weight:600;color:var(--muted);font-size:.72rem}
#board{width:100%;height:100%;display:block}
.tl-a{fill:var(--tile)} .tl-b{fill:var(--tile-2)}
.grid-line{stroke:rgba(90,70,40,.14);stroke-width:1}
.wallb{fill:var(--wallc)} .wallt{fill:var(--wall-top)}
.pt-ring{fill:none;stroke:var(--gold);stroke-width:2.4;stroke-dasharray:4 3}
.pt-fill{fill:rgba(215,154,23,.16)}
.pt-fill.s0{fill:rgba(47,95,208,.22)} .pt-fill.s1{fill:rgba(207,62,51,.22)}
.pt-flag{fill:var(--gold)}
.tok{transition:transform .32s cubic-bezier(.3,.7,.3,1), opacity .35s}
.tok-body.s0{fill:var(--blue)} .tok-body.s1{fill:var(--red)}
.tok-icon{fill:none;stroke:#fff;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.tok-hp{fill:#fff;stroke:rgba(0,0,0,.25);stroke-width:.6}
.tok-hp.lost{fill:rgba(255,255,255,.25)}
.tok-sel{fill:none;stroke:var(--ink);stroke-width:2.4;opacity:0}
.tok.selected .tok-sel{opacity:1}
.tok.dead{opacity:0}
.tok.brace .tok-shield{opacity:1}
.tok-shield{opacity:0;fill:#fff;stroke:var(--ink);stroke-width:1.2}
.ord-move{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:5 4}
.ord-move.s0{stroke:var(--blue)} .ord-move.s1{stroke:var(--red)}
.ord-head.s0{fill:var(--blue)} .ord-head.s1{fill:var(--red)}
.ord-aim{fill:none;stroke-width:2.4}
.ord-aim.s0{stroke:var(--blue)} .ord-aim.s1{stroke:var(--red)}
.ord-blast{stroke:none}
.ord-blast.s0{fill:rgba(47,95,208,.16)} .ord-blast.s1{fill:rgba(207,62,51,.16)}
.ord-warn{fill:#fff;stroke:var(--bad);stroke-width:2}
.hl-move{fill:rgba(31,29,26,.08);stroke:rgba(31,29,26,.5);stroke-width:1.4}
.hl-attack{fill:rgba(196,59,48,.1);stroke:rgba(196,59,48,.6);stroke-width:1.4}
.hit-layer rect{fill:transparent;cursor:pointer}
.fx-shot{stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}
.fx-boom{fill:rgba(255,190,60,.55);stroke:#c4561c;stroke-width:1.5}
.fx-dmg{font-family:var(--font-display);font-size:16px}
.unitrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ucard{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px 6px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);min-height:64px}
.ucard svg{width:22px;height:22px}
.ucard .nm{font-size:.76rem;font-weight:800;line-height:1}
.ucard .od{font-size:.72rem;color:var(--muted);font-weight:700}
.ucard[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.ucard.dead{opacity:.35}
.ucard.set .od{color:var(--ink)}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.modes button{min-height:42px;padding:6px 4px;font-size:.88rem}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.modes button.order[aria-pressed="true"]{background:var(--surface);color:var(--ink);border:2.5px solid var(--gold)}
.bar-row{display:flex;gap:8px;align-items:center}
.bar-row .btn{flex:1}
.timer{font-variant-numeric:tabular-nums;font-weight:800}
.cover-kicker{margin:0;font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cover.s0 h2{color:var(--blue)} .cover.s1 h2{color:var(--red)}
#screen-game .actionbar{min-height:212px;justify-content:flex-end}
.say{font-size:.92rem;text-align:center;margin:0;color:var(--muted);min-height:1.3em}
.say b{color:var(--ink)}
.say.warn{color:var(--bad);font-weight:700}

</style>
</head>
<body>
<div id="app" class="app">
  <section id="screen-title" class="screen title-screen"></section>
  <section id="screen-game" class="screen" hidden>
    <header class="topbar">
      <button id="btn-menu" class="icon-btn" type="button" aria-label="Menu"></button>
      <div class="status"><div class="status-main" id="st-main">Plan your orders</div><div class="status-sub" id="st-sub"></div></div>
      <div class="scores" id="scores"></div>
    </header>
    <div class="stage" id="stage"></div>
    <div class="actionbar" id="actionbar"></div>
  </section>
</div>
<script>
/* Shared game kit: title screen, menus, pass-the-phone covers, banners, sound.

      var o = plan[u.id];
      if (!u.alive || u.side !== side || !o || o.k !== "attack") return;
      SG.hitTiles(u.kind, o.to).forEach(function (t) {
        Object.keys(ends).forEach(function (id) { if (ends[id] === t) risky.push(t); });
      });
    });
    return risky;
  }

  function renderOrders() {
    var g = G.layers.orders;
    g.innerHTML = "";
    var sides = G.phase === "reveal" ? [0, 1] : (G.phase === "plan" && G.planSide != null ? [G.planSide] : []);
    sides.forEach(function (side) {
      var plan = G.plans[side] || {};
      G.state.units.forEach(function (u) {
        var o = plan[u.id];
        if (!u.alive || u.side !== side || !o) return;
        if (o.k === "move") arrow(g, u.pos, o.to, SC[side]);
        if (o.k === "attack") aim(g, u.kind, o.to, SC[side]);
      });
      if (G.phase === "plan") friendlyRisk(side).forEach(function (t) {
        g.appendChild(sv("circle", { cx: px(t) - 14, cy: py(t) - 14, r: "7", class: "ord-warn" }));
        g.appendChild(sv("text", { x: px(t) - 14, y: py(t) - 10.5, "text-anchor": "middle", "font-size": "10", "font-weight": "800", fill: "#c43b30", text: "!" }));
      });
    });
  }

  function renderTop() {
    var st = G.state, main, sub;
    if (st.winner != null) { main = st.winner === "draw" ? "Draw" : SG.sideName(st.winner) + " wins"; sub = st.reason; }
    else if (G.phase === "plan" && G.resolver) { main = G.cfg.mode === "local" ? SG.sideName(G.planSide) + ": plan" : "Plan your orders"; sub = "Turn " + st.turn + " of " + SG.TURN_LIMIT + " · first to " + SG.WIN_POINTS; }
    else if (G.phase === "reveal") { main = "Reveal"; sub = "Turn " + st.turn; }
    else { main = "Turn " + st.turn; sub = ""; }
    K.$("#st-main").textContent = main;
    K.$("#st-sub").textContent = sub;
    var sc = K.$("#scores");
    sc.innerHTML = "";
    [0, 1].forEach(function (side) {
      sc.appendChild(h("span", { class: "chip", title: SG.sideName(side) + " points" }, h("i", { style: "background:" + COLOR[side] }), String(st.scores[side]), h("small", null, "/" + SG.WIN_POINTS)));
    });
  }

  function orderWord(o) {
    if (!o || o.k === "hold") return "Hold";
    return o.k === "move" ? "Move" : o.k === "attack" ? "Attack" : "Brace";
  }

  function renderBar() {
    var bar = K.$("#actionbar");
    bar.innerHTML = "";
    var st = G.state;
    if (st.winner != null) {
      bar.appendChild(h("p", { class: "say", html: G.say || "&nbsp;" }));
      bar.appendChild(h("div", { class: "bar-row" },
        h("button", { class: "btn btn-primary", type: "button", onclick: function () { restart(); } }, "Rematch"),
        h("button", { class: "btn", type: "button", onclick: function () { K.quit(); } }, "Main menu")));
      return;
    }
    if (G.phase !== "plan" || !G.resolver) {
      bar.appendChild(h("p", { class: "say", html: G.say || "&nbsp;" }));
      return;
    }
    var side = G.planSide, plan = G.plans[side];
    var row = h("div", { class: "unitrow" });
    st.units.forEach(function (u) {
      if (u.side !== side) return;
      row.appendChild(h("button", {
        class: "ucard" + (u.alive ? "" : " dead") + (plan[u.id] && plan[u.id].k !== "hold" ? " set" : ""), type: "button", disabled: !u.alive,
        "aria-pressed": G.sel === u.id ? "true" : "false", onclick: function () { selectUnit(u.id); }
      }, h("span", { html: iconSvg(u.kind, COLOR[side]) }), h("span", { class: "nm" }, SG.KINDS[u.kind].name), h("span", { class: "od" }, u.alive ? orderWord(plan[u.id]) : "down")));
    });
    bar.appendChild(row);
    var risky = friendlyRisk(side).length > 0;
    var hint = risky ? "Careful: one of your attacks lands on your own unit." : G.sel < 0 ? "Pick a unit, then tap the board to give it an order." :
      G.mode === "move" ? "Tap a square to move there." : G.mode === "attack" ? "Tap the square you think an enemy will be on." : "";
    bar.appendChild(h("p", { class: "say" + (risky ? " warn" : "") }, hint));
    if (G.sel >= 0) {
      var modes = h("div", { class: "modes" });
      [["move", "Move"], ["attack", "Attack"], ["brace", "Brace"], ["hold", "Hold"]].forEach(function (m) {
        var cur = plan[G.sel] ? plan[G.sel].k : "hold";
        var pressed = (m[0] === "move" || m[0] === "attack") ? G.mode === m[0] : cur === m[0];
        var isOrder = m[0] === "brace" || m[0] === "hold";
        modes.appendChild(h("button", { class: "btn btn-sm" + (isOrder ? " order" : ""), type: "button", "aria-pressed": pressed ? "true" : "false", onclick: function () { setMode(m[0]); } }, m[1]));
      });
      bar.appendChild(modes);
    }
    var ready = h("div", { class: "bar-row" });
    if (G.timerEnd) ready.appendChild(h("span", { class: "timer", id: "timer" }, Math.max(0, Math.ceil((G.timerEnd - Date.now()) / 1000)) + "s"));
    ready.appendChild(h("button", { class: "btn btn-primary", type: "button", onclick: function () { K.Sound.play("select"); commit(); } }, "Lock in orders"));
    bar.appendChild(ready);
  }

  /* ---------- Input ---------- */
  function selectUnit(id) {
    var u = G.state.units[id];
    if (!u.alive || u.side !== G.planSide) return;
    K.Sound.play("tap");
    G.sel = id;
    var o = G.plans[G.planSide][id];
    G.mode = o && o.k === "attack" ? "attack" : "move";
    render();
  }
  function setMode(m) {
    if (G.sel < 0) return;
    K.Sound.play("tap");
    if (m === "brace" || m === "hold") { G.plans[G.planSide][G.sel] = { k: m }; G.mode = "move"; nextUnit(); }
    else G.mode = m;
    render();
  }
  function nextUnit() {
    var side = G.planSide, plan = G.plans[side];
    var mine = G.state.units.filter(function (u) { return u.alive && u.side === side; });
    var k = mine.findIndex(function (u) { return u.id === G.sel; });
    for (var q = 1; q <= mine.length; q++) {
      var u = mine[(k + q) % mine.length];
      if (!plan[u.id] || plan[u.id].k === "hold") { G.sel = u.id; G.mode = "move"; return; }
    }
  }
  function onTile(i) {
    if (G.phase !== "plan" || !G.resolver) return;
    var st = G.state, side = G.planSide;
    var there = SG.unitAt(st, i);
    if (there && there.side === side && (G.mode !== "attack" || G.sel < 0)) { selectUnit(there.id); return; }
    if (G.sel < 0) return;
    var u = st.units[G.sel];
    if (G.mode === "move") {
      if (i === u.pos) { G.plans[side][u.id] = { k: "hold" }; K.Sound.play("tap"); render(); return; }
      if (SG.moveTargets(st, u).indexOf(i) < 0) { K.Sound.play("error"); return; }
      G.plans[side][u.id] = { k: "move", to: i };
    } else {
      if (SG.attackTargets(st, u).indexOf(i) < 0) { K.Sound.play("error"); return; }
      G.plans[side][u.id] = { k: "attack", to: i };
    }
    K.Sound.play("select");
    nextUnit();
    render();
  }

  function commit() {
    if (!G.resolver) return;
    stopTimer();
    var r = G.resolver; G.resolver = null;
    r();
  }

  function startTimer() {
    stopTimer();
    if (G.cfg.timer !== "30") { G.timerEnd = 0; return; }
    G.timerEnd = Date.now() + 30000;
    G.timerId = setInterval(function () {
      var left = Math.ceil((G.timerEnd - Date.now()) / 1000);
      var el = K.$("#timer");
      if (el) el.textContent = Math.max(0, left) + "s";
      if (left <= 5 && left > 0) K.Sound.play("tick");
      if (left <= 0) { K.toast("Time! Unset units hold."); commit(); }
    }, 250);
  }
  function stopTimer() { if (G.timerId) clearInterval(G.timerId); G.timerId = null; G.timerEnd = 0; }

  /* ---------- Turn flow ---------- */
  function plan(side) {
    return new Promise(function (resolve) {
      G.phase = "plan";
      G.planSide = side;
      G.plans[side] = {};
      G.state.units.forEach(function (u) { if (u.alive && u.side === side) G.plans[side][u.id] = { k: "hold" }; });
      var first = G.state.units.filter(function (u) { return u.alive && u.side === side; })[0];
      G.sel = first ? first.id : -1;
      G.mode = "move";
      G.resolver = resolve;
      startTimer();
      render();
    });
  }

  async function passTo(side, title, text) {
    G.viewer = side;
    G.phase = "cover";
    buildBoard();
    render();
    await K.cover({ className: SC[side], kicker: "Turn " + G.state.turn, title: title, text: text, cta: "I'm " + SG.sideName(side) });
  }

  async function reveal(token) {
    var st = G.state;
    G.phase = "reveal";
    G.sel = -1;
    render();
    await K.banner("REVEAL", { tone: "accent", ms: 700 });
    if (token !== G.token) return;
    await K.sleep(700);
    var before = SG.cloneState(st);
    var orders = Object.assign({}, G.plans[0], G.plans[1]);
    var ev = SG.resolve(st, orders);
    /* moves */
    var moved = ev.moves.length > 0;
    ev.bumps.forEach(function (b) {
      var n = G.nodes[b.id];
      if (n && n.animate) {
        var mx = (px(b.to) - px(b.from)) * 0.35, my = (py(b.to) - py(b.from)) * 0.35;
        try { n.animate([{ transform: "translate(" + px(b.from) + "px," + py(b.from) + "px)" }, { transform: "translate(" + (px(b.from) + mx) + "px," + (py(b.from) + my) + "px)" }, { transform: "translate(" + px(b.from) + "px," + py(b.from) + "px)" }], { duration: 420 }); } catch (e) {}
      }
    });
    var hpNow = st.units.map(function (u) { return u.hp; });
    var aliveNow = st.units.map(function (u) { return u.alive; });
    st.units.forEach(function (u, k) { u.hp = before.units[k].hp; u.alive = before.units[k].alive; });
    G.phase = "reveal-move";
    render();
    if (moved) K.Sound.play("slide");
    if (ev.bumps.length) { K.Sound.play("error"); G.say = "<b>Bump!</b> Units heading for the same square bounced back."; }
    await K.sleep(520);
    if (token !== G.token) return;
    /* attacks */
    G.layers.orders.innerHTML = "";
    ev.attacks.forEach(function (a) {
      var shot = sv("line", { x1: px(a.from), y1: py(a.from), x2: px(a.to), y2: py(a.to), class: "fx-shot" });
      G.layers.fx.appendChild(shot);
      a.tiles.forEach(function (t) {
        var boom = sv("circle", { cx: px(t), cy: py(t), r: "16", class: "fx-boom" });
        G.layers.fx.appendChild(boom);
        setTimeout(function () { boom.remove(); }, 650);
      });
      setTimeout(function () { shot.remove(); }, 450);
    });
    if (ev.attacks.length) K.Sound.play("whoosh");
    await K.sleep(300);
    st.units.forEach(function (u, k) { u.hp = hpNow[k]; u.alive = aliveNow[k]; });
    var any = false;
    Object.keys(ev.damage).forEach(function (id) {
      var u = st.units[+id], amount = ev.damage[id];
      if (!amount) return;
      any = true;
      var t = sv("text", { x: px(u.pos), y: py(u.pos) - 22, "text-anchor": "middle", class: "fx-dmg", fill: "#c43b30", text: "−" + amount });
      G.layers.fx.appendChild(t);
      if (t.animate) try { t.animate([{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(-14px)", opacity: 0 }], { duration: 1100, fill: "forwards" }); } catch (e) {}
      setTimeout(function () { t.remove(); }, 1150);
    });
    if (any) { K.Sound.play("hit"); K.shake(K.$("#stage")); }
    else if (ev.attacks.length) K.Sound.play("miss");
    render();
    var notes = [];
    var hitsOnEnemy = 0, friendly = 0, misses = 0;
    ev.attacks.forEach(function (a) { if (!a.hits.length) misses++; a.hits.forEach(function (x) { if (x.friendly) friendly++; else hitsOnEnemy++; }); });
    if (ev.deaths.length) notes.push(ev.deaths.map(function (id) { var u = st.units[id]; return SG.sideName(u.side) + " " + SG.KINDS[u.kind].name; }).join(", ") + " down.");
    if (misses) notes.push(misses + (misses === 1 ? " shot" : " shots") + " hit empty ground.");
    if (friendly) notes.push(friendly + " friendly " + (friendly === 1 ? "hit" : "hits") + "!");
    await K.sleep(800);
    if (token !== G.token) return;
    /* points */
    ev.held.forEach(function (hd) {
      var t = sv("text", { x: px(hd.pt), y: py(hd.pt) - 26, "text-anchor": "middle", class: "fx-dmg", fill: COLOR[hd.side], text: "+1" });
      G.layers.fx.appendChild(t);
      setTimeout(function () { t.remove(); }, 900);
    });
    if (ev.held.length) K.Sound.play("score");
    notes.unshift("Blue <b>+" + ev.points[0] + "</b> · Red <b>+" + ev.points[1] + "</b>.");
    G.say = notes.join(" ");
    G.plans = [{}, {}];
    G.phase = "after";
    render();
    await K.sleep(900);
  }

  async function runGame(token) {
    var st = G.state;
    var local = G.cfg.mode === "local";
    while (st.winner == null) {
      if (token !== G.token) return;
      if (local) {
        await passTo(0, "Blue's orders", "Red, look away while Blue plans.");
        if (token !== G.token) return;
        await plan(0);
        if (token !== G.token) return;
        await passTo(1, "Red's orders", "Blue, look away while Red plans.");
        if (token !== G.token) return;
        await plan(1);
        if (token !== G.token) return;
        G.viewer = 0;
        G.phase = "cover";
        buildBoard();
        render();
        await K.cover({ kicker: "Turn " + st.turn, title: "Reveal", text: "Both players, look at the board.", cta: "Show me" });
        if (token !== G.token) return;
      } else {
        G.viewer = 0;
        await plan(0);
        if (token !== G.token) return;
        G.plans[1] = SG.bots.plan(st, 1, G.level, G.rand);
      }
      await reveal(token);
    }
    if (token !== G.token) return;
    await endGame(token);
  }

  async function endGame(token) {
    var st = G.state;
    stopTimer();
    render();
    var youWon = G.cfg.mode === "bot" ? st.winner === 0 : null;
    await K.banner(st.winner === "draw" ? "DRAW" : SG.sideName(st.winner).toUpperCase() + " WINS", { tone: st.winner === 0 ? "accent" : "bad", ms: 1500 });
    if (token !== G.token) return;
    var choice = await K.gameOver({
      title: G.cfg.mode === "bot" ? (st.winner === "draw" ? "A draw" : youWon ? "You win!" : "You lose") : (st.winner === "draw" ? "A draw" : SG.sideName(st.winner) + " wins"),
      tone: youWon === false ? "bad" : "good",
      text: st.reason,
      stats: [["Points (Blue – Red)", st.scores[0] + " – " + st.scores[1]], ["Turns", st.turn]],
      reviewLabel: "Look at the board"
    });
    if (token !== G.token) return;
    if (choice === "rematch") restart();
  }

  /* ---------- Lifecycle ---------- */
  function start(cfg) {
    G.cfg = cfg;
    G.level = cfg.difficulty || "normal";
    G.human = cfg.mode === "local" ? [true, true] : [true, false];
    newMatch();
  }
  function newMatch() {
    G.token++;
    stopTimer();
    G.state = SG.newGame();
    G.rand = SG.rng((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0);
    G.plans = [{}, {}]; G.sel = -1; G.resolver = null; G.phase = "plan"; G.planSide = 0; G.viewer = 0;
    G.say = "";
    K.showScreen("game");
    buildBoard();
    render();
    runGame(G.token);
  }
  function restart() { K.$all(".cover,.modal-wrap,.banner").forEach(function (n) { n.remove(); }); newMatch(); }
  function quit() { G.token++; stopTimer(); G.resolver = null; }

  window.__secondDebug = { G: G };

  K.init({
    ns: "second-guess",
    title: "Second Guess",
    tagline: "Both players move at the same time. Aim where they'll be, not where they are.",
    art: TITLE_ART,
    rules: RULES,
    options: [
      { id: "mode", label: "Opponent", default: "bot", choices: [{ v: "bot", t: "Bot" }, { v: "local", t: "Friend, same phone" }] },
      { id: "difficulty", label: "Bot level", default: "normal", choices: [{ v: "easy", t: "Easy" }, { v: "normal", t: "Normal" }, { v: "hard", t: "Hard" }], showIf: function (c) { return c.mode === "bot"; },
        note: function (c) { return c.difficulty === "hard" ? "Predicts your likely plans and counters them." : c.difficulty === "easy" ? "Mostly shoots where you are, not where you'll be." : "Tries to guess where you'll move."; } },
      { id: "timer", label: "Planning timer", default: "off", choices: [{ v: "off", t: "Off" }, { v: "30", t: "30 seconds" }],
        note: function (c) { return c.mode === "local" ? "Cover screens hide each player's orders from the other." : null; } }
    ],
    onStart: start,
    onRestart: restart,
    onQuit: quit,
    menuNote: function () { return G.state ? "Turn " + G.state.turn + ". Blue " + G.state.scores[0] + ", Red " + G.state.scores[1] + "." : ""; }
  });
})();

</script>
</body>
</html>
