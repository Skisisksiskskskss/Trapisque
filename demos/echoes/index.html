<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Echoes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* ---------- Shared game kit: layout shell, controls, overlays ----------
   Each game sets its own palette and fonts by overriding these tokens on :root. */
:root{
  --bg:#101318; --bg-2:#161a21; --surface:#1d222b; --surface-2:#262c37; --line:#343b48;
  --ink:#eef1f5; --muted:#a3abb8; --accent:#f2c14e; --accent-ink:#17130a;
  --good:#47d18c; --bad:#ff6b5e; --p1:#5aa2ff; --p2:#ff6b5e;
  --font-display:system-ui,sans-serif; --font-body:system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:16px; --radius-sm:10px;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
  color-scheme:dark;
}
[hidden]{display:none !important}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg);-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}

/* ---------- Title screen ---------- */
.title-screen{overflow-y:auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:20px 28px;align-items:center}
.title-inner{width:100%;max-width:460px;display:flex;flex-direction:column;gap:20px;margin:auto 0}
.title-art{display:flex;justify-content:center}
.title-art svg{width:min(70vw,260px);height:auto}
.title-name{font-family:var(--font-display);font-size:clamp(2.3rem,9vw,3.3rem);line-height:.98;margin:0;text-align:center;letter-spacing:-.01em}
.title-tag{color:var(--muted);text-align:center;margin:0;font-size:1.02rem}
.opt-group{display:flex;flex-direction:column;gap:7px}
.opt-label{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--bg-2);border:1px solid var(--line);border-radius:14px}
.seg button{border:0;background:transparent;border-radius:10px;padding:10px 6px;min-height:44px;font-weight:650;font-size:.95rem;color:var(--muted);line-height:1.15}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 2px 8px rgba(0,0,0,.25)}
.opt-note{font-size:.86rem;color:var(--muted);margin:0}
.title-actions{display:flex;flex-direction:column;gap:10px;margin-top:4px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:1rem;line-height:1.1;transition:transform .08s, background .15s, border-color .15s, opacity .15s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent}
.btn-danger{background:var(--bad);border-color:var(--bad);color:#160807}
.btn-sm{min-height:38px;padding:7px 14px;font-size:.9rem}
.btn-wide{width:100%}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;flex:none}
.icon-btn svg{width:22px;height:22px}

/* ---------- Game screen frame ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:10px var(--gutter-r) 8px var(--gutter-l);min-height:60px}
.topbar .status{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.topbar .status-main{font-family:var(--font-display);font-size:1.15rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .status-sub{font-size:.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:4px var(--gutter-r) 4px var(--gutter-l)}
.stage > svg, .stage > .board{max-width:100%;max-height:100%}
.actionbar{padding:8px var(--gutter-r) 12px var(--gutter-l);display:flex;flex-direction:column;gap:8px}
.action-row{display:flex;gap:8px;align-items:stretch}
.action-row > *{flex:1}
.hint-line{font-size:.9rem;color:var(--muted);text-align:center;min-height:1.3em;margin:0}

/* ---------- Overlays ---------- */
.cover{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  padding:24px var(--gutter-r) 24px var(--gutter-l);background:var(--bg);animation:kit-fade .18s ease-out}
.cover .cover-badge{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:2px solid var(--line)}
.cover .cover-badge svg{width:42px;height:42px}
.cover h2{font-family:var(--font-display);font-size:clamp(1.9rem,8vw,2.6rem);margin:0;line-height:1.05}
.cover p{margin:0;color:var(--muted);max-width:32ch}
.cover .btn{margin-top:10px;min-width:220px}
.modal-wrap{position:absolute;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,6,10,.62);animation:kit-fade .15s ease-out}
@media (min-width:640px){ .modal-wrap{align-items:center} }
.modal{width:100%;max-width:560px;max-height:88%;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.4);animation:kit-rise .2s ease-out}
@media (min-width:640px){ .modal{border-radius:22px} }
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 18px 8px}
.modal-head h2{flex:1;margin:0;font-family:var(--font-display);font-size:1.45rem;line-height:1.1}
.modal-body{padding:6px 18px 12px;overflow-y:auto;min-height:0;user-select:text;-webkit-user-select:text}
.modal-actions{display:flex;flex-direction:column;gap:8px;padding:10px 18px calc(16px + env(safe-area-inset-bottom, 0px))}
.banner{position:absolute;left:0;right:0;top:38%;z-index:45;display:flex;flex-direction:column;align-items:center;pointer-events:none;text-align:center;padding:0 var(--gutter-r) 0 var(--gutter-l)}
.banner-text{font-family:var(--font-display);font-size:clamp(2.6rem,13vw,4.6rem);line-height:1;padding:10px 22px;border-radius:18px;color:var(--ink);text-shadow:0 4px 24px rgba(0,0,0,.55);animation:kit-pop .9s cubic-bezier(.2,.9,.3,1.3) both}
.banner-sub{margin-top:8px;font-weight:700;color:var(--ink);background:rgba(0,0,0,.55);padding:6px 12px;border-radius:999px;animation:kit-fade .3s .15s both}
.banner.tone-good .banner-text{color:var(--good)}
.banner.tone-bad .banner-text{color:var(--bad)}
.banner.tone-accent .banner-text{color:var(--accent)}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:46;max-width:calc(100% - 32px);padding:9px 16px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:650;font-size:.94rem;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:kit-drop .2s ease-out;text-align:center}
.shake{animation:kit-shake .38s linear}
@keyframes kit-fade{from{opacity:0}to{opacity:1}}
@keyframes kit-rise{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes kit-drop{from{transform:translate(-50%,-10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes kit-pop{0%{transform:scale(.4);opacity:0}25%{transform:scale(1.08);opacity:1}75%{transform:scale(1);opacity:1}100%{transform:scale(1.02);opacity:0}}
@keyframes kit-shake{0%,100%{transform:none}20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,2px)}}
@media (prefers-reduced-motion: reduce){
  .banner-text{animation-duration:.01s}
  .shake{animation:none}
}

/* ---------- Rules text ---------- */
.rules h3{font-family:var(--font-display);font-size:1.15rem;margin:16px 0 6px}
.rules h3:first-child{margin-top:4px}
.rules p{margin:0 0 8px;color:var(--ink)}
.rules ul,.rules ol{margin:0 0 10px;padding-left:1.2em;display:flex;flex-direction:column;gap:5px}
.rules li::marker{color:var(--muted)}
.rules .tip{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:.92rem}
.rules b{color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0 0 10px;align-items:start}
.kv dt{font-weight:750;white-space:nowrap}
.kv dd{margin:0;color:var(--muted)}
.result-stats{display:grid;grid-template-columns:1fr auto;gap:6px 16px;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.result-stats span:nth-child(even){font-weight:750;text-align:right}

/* Echoes: a night arena. Cyan against magenta, gold gems, ghosts of past turns. */
:root{
  --bg:#0b0a1f; --bg-2:#12112b; --surface:#191837; --surface-2:#23214a; --line:#34315f;
  --ink:#eeeefe; --muted:#a9a6d6; --accent:#ffd166; --accent-ink:#1d1405;
  --good:#5ef2c4; --bad:#ff5d7a;
  --cyan:#36e2ff; --magenta:#ff4fd8; --gem:#ffd166; --floor:#15143a; --floor-2:#191846; --wall:#2c2a66; --wall-top:#3d3a88;
  --plate:#5ef2c4; --door:#ffb347;
  --font-display:"Unbounded","Arial Rounded MT Bold",system-ui,sans-serif;
  --font-body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
}
body{background:radial-gradient(120% 80% at 50% 0%, #1b1850 0%, var(--bg) 60%)}
.title-name{font-weight:800;letter-spacing:-.02em;background:linear-gradient(90deg,var(--cyan),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent}
.topbar .status-main{font-weight:700;font-size:1.02rem}
.scores{display:flex;gap:6px;flex:none}
.chip{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:800;font-size:.95rem;font-variant-numeric:tabular-nums}
.chip i{width:9px;height:9px;border-radius:50%;display:block}
.timeline{display:flex;align-items:center;gap:10px;padding:0 var(--gutter-r) 4px var(--gutter-l)}
.timeline .rnd{font-family:var(--font-display);font-size:.78rem;font-weight:700;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
.timeline .ticks{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;flex:1}
.timeline .ticks span{height:8px;border-radius:4px;background:var(--surface-2)}
.timeline .ticks span.done{background:#4a4790}
.timeline .ticks span.now{background:var(--accent)}
.timeline .who{font-size:.8rem;font-weight:700;color:var(--muted);white-space:nowrap}
#board{width:100%;height:100%;display:block}
.fl-a{fill:var(--floor)} .fl-b{fill:var(--floor-2)}
.wall{fill:var(--wall)} .wall-top{fill:var(--wall-top)}
.gem{fill:var(--gem)} .gem-val{fill:#1d1405;font-size:10px;font-weight:800;font-family:var(--font-body)}
.gem-ring{fill:none;stroke:rgba(255,209,102,.35);stroke-width:1.4}
.plate{fill:none;stroke:var(--plate);stroke-width:2.2}
.plate-in{fill:rgba(94,242,196,.18)}
.plate.on{fill:rgba(94,242,196,.35)}
.door-closed{fill:var(--door)}
.door-open{fill:none;stroke:var(--door);stroke-width:1.6;stroke-dasharray:3 3;opacity:.7}
.spawn{fill:none;stroke-width:2;stroke-dasharray:2 3}
.spawn.c0{stroke:var(--cyan)} .spawn.c1{stroke:var(--magenta)}
.link{stroke:rgba(94,242,196,.25);stroke-width:1.2;stroke-dasharray:2 4;fill:none}
.unit{transition:transform .26s cubic-bezier(.3,.7,.3,1), opacity .3s}
.u-body.c0{fill:var(--cyan)} .u-body.c1{fill:var(--magenta)}
.u-echo.c0{fill:rgba(54,226,255,.22);stroke:var(--cyan);stroke-width:1.8;stroke-dasharray:3 2}
.u-echo.c1{fill:rgba(255,79,216,.22);stroke:var(--magenta);stroke-width:1.8;stroke-dasharray:3 2}
.u-num{font-size:11px;font-weight:800;font-family:var(--font-body)}
.u-num.live{fill:#0b0a1f}
.u-num.c0.echo{fill:var(--cyan)} .u-num.c1.echo{fill:var(--magenta)}
.u-halo{fill:none;stroke:#fff;stroke-width:2;opacity:0}
.unit.acting .u-halo{opacity:.9}
.unit.dead{opacity:0}
.path-c0{stroke:var(--cyan)} .path-c1{stroke:var(--magenta)}
.fpath{fill:none;stroke-width:1.6;stroke-dasharray:2 3;opacity:.75}
.fdot{stroke:none;opacity:.9}
.fdot.c0{fill:var(--cyan)} .fdot.c1{fill:var(--magenta)}
.ftext{font-size:9.5px;font-weight:800;fill:#0b0a1f;font-family:var(--font-body)}
.trail{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.45}
.opt-move{fill:rgba(255,255,255,.1);stroke:rgba(255,255,255,.75);stroke-width:1.6}
.opt-strike{fill:none;stroke:var(--bad);stroke-width:2.6}
.pend{fill:rgba(255,255,255,.18);stroke:#fff;stroke-width:2.4}
.hit-layer rect{fill:transparent;cursor:pointer}
.float-pts{font-family:var(--font-display);font-size:15px;font-weight:800}
.fx-strike{stroke:#fff;stroke-width:3;stroke-linecap:round}
.cover-kicker{margin:0;font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
#screen-game .actionbar{min-height:150px;justify-content:flex-end}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.toggle{display:flex;align-items:center;gap:6px;font-size:.86rem;font-weight:650;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 11px;min-height:40px}
.toggle[aria-pressed="true"]{color:var(--ink);border-color:var(--accent)}
.toggle svg{width:17px;height:17px}
.bar-row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.say{font-size:.95rem;text-align:center;margin:0;min-height:2.6em;color:var(--ink)}
.say b{color:var(--accent)}
.rules .mini{display:flex;gap:10px;align-items:center;margin:6px 0 10px}
.rules .mini svg{width:96px;height:auto;flex:none}

</style>
</head>
<body>
<div id="app" class="app">
  <section id="screen-title" class="screen title-screen"></section>
  <section id="screen-game" class="screen" hidden>
    <header class="topbar">
      <button id="btn-menu" class="icon-btn" type="button" aria-label="Menu"></button>
      <div class="status"><div class="status-main" id="st-main">Round 1</div><div class="status-sub" id="st-sub"></div></div>
      <div class="scores" id="scores"></div>
    </header>
    <div class="timeline" id="timeline"></div>
    <div class="stage" id="stage"></div>
    <div class="actionbar" id="actionbar"></div>
  </section>
</div>
<script>

    var fc = E.echoForecast(G.state);
    G.state.units.forEach(function (u) {
      var path = fc[u.id];
      if (!path || !path.length) return;
      var d = "M" + cx(u.pos) + " " + cy(u.pos);
      var last = u.pos;
      path.forEach(function (p) { if (p.pos !== last) { d += "L" + cx(p.pos) + " " + cy(p.pos); last = p.pos; } });
      g.appendChild(sv("path", { d: d, class: "fpath path-" + SIDE[u.side] }));
      var prev = u.pos;
      path.forEach(function (p) {
        if (p.pos === prev && !p.end) return;
        prev = p.pos;
        var off = u.side === 0 ? 10 : -10;
        g.appendChild(sv("circle", { cx: cx(p.pos) + off, cy: cy(p.pos) - 13, r: "7", class: "fdot " + SIDE[u.side] }));
        g.appendChild(sv("text", { x: cx(p.pos) + off, y: cy(p.pos) - 9.6, "text-anchor": "middle", class: "ftext", text: p.end ? "×" : String(p.t) }));
      });
    });
  }

  function renderTrails() {
    var g = G.layers.trails;
    g.innerHTML = "";
    var st = G.state;
    if (st.phase === "over") return;
    st.live.forEach(function (id) {
      var u = st.units[id];
      var pos = E.SPAWN[u.side], d = "M" + cx(pos) + " " + cy(pos);
      u.rec.forEach(function (a) { if (a.k === "move") { var t = E.step(pos, a.d); if (t >= 0) { pos = t; d += "L" + cx(pos) + " " + cy(pos); } } });
      if (u.rec.length) g.appendChild(sv("path", { d: d, class: "trail path-" + SIDE[u.side] }));
    });
  }

  function renderOpts() {
    var g = G.layers.opts;
    g.innerHTML = "";
    if (!G.resolver) return;
    var st = G.state, side = G.turnSide;
    var u = st.units[st.live[side]];
    E.liveOptions(st, side).forEach(function (a) {
      if (a.k === "move") {
        var t = E.step(u.pos, a.d);
        g.appendChild(sv("rect", { x: PAD + E.cOf(t) * S + 4, y: PAD + E.rOf(t) * S + 4, width: S - 8, height: S - 8, rx: 6, class: "opt-move" }));
      } else if (a.k === "strike") {
        var t2 = E.step(u.pos, a.d);
        g.appendChild(sv("circle", { cx: cx(t2), cy: cy(t2), r: "20", class: "opt-strike" }));
      }
    });
  }

  function renderTop() {
    var st = G.state;
    var main, sub;
    if (st.phase === "over") {
      main = st.winner === "draw" ? "Draw" : E.sideName(st.winner) + " wins";
      sub = st.reason;
    } else if (G.resolver) {
      main = G.cfg.mode === "local" ? E.sideName(G.turnSide) + "'s move" : "Your move";
      sub = "Round " + st.round + " of " + E.ROUNDS + " · tick " + st.tick + " of " + E.TICKS;
    } else {
      main = G.thinking != null ? E.sideName(G.thinking) + " is thinking" : "Round " + st.round + " of " + E.ROUNDS;
      sub = "Tick " + Math.max(1, st.tick) + " of " + E.TICKS;
    }
    K.$("#st-main").textContent = main;
    K.$("#st-sub").textContent = sub;
    var sc = K.$("#scores");
    sc.innerHTML = "";
    [0, 1].forEach(function (side) {
      sc.appendChild(h("span", { class: "chip", title: E.sideName(side) + " points" }, h("i", { style: "background:" + COLORS[side] }), String(st.scores[side])));
    });
    var tl = K.$("#timeline");
    tl.innerHTML = "";
    var ticks = h("div", { class: "ticks" });
    for (var t = 1; t <= E.TICKS; t++) ticks.appendChild(h("span", { class: t < st.tick ? "done" : t === st.tick ? "now" : "" }));
    var first = st.tick >= 1 ? (st.firstOfRound + st.tick - 1) % 2 : null;
    tl.appendChild(h("span", { class: "rnd" }, "R" + st.round + "/" + E.ROUNDS));
    tl.appendChild(ticks);
    if (first != null && st.phase !== "over") tl.appendChild(h("span", { class: "who", style: "color:" + COLORS[first] }, E.sideName(first) + " first"));
  }

  function pathToggle() {
    return h("button", { class: "toggle", type: "button", "aria-pressed": G.showPaths ? "true" : "false", onclick: function () {
      G.showPaths = !G.showPaths; K.store.set("paths", G.showPaths); K.Sound.play("tap"); render();
    }, html: K.ICONS.eye + "<span>Echo paths</span>" });
  }

  function renderBar() {
    var bar = K.$("#actionbar");
    bar.innerHTML = "";
    var st = G.state;
    bar.appendChild(h("p", { class: "say", html: G.say || "&nbsp;" }));
    if (st.phase === "over") {
      bar.appendChild(h("div", { class: "action-row" },
        h("button", { class: "btn btn-primary", type: "button", onclick: function () { restart(); } }, "Rematch"),
        h("button", { class: "btn", type: "button", onclick: function () { K.quit(); } }, "Main menu")));
      return;
    }
    if (G.resolver) {
      bar.appendChild(h("div", { class: "bar-row" },
        pathToggle(),
        h("button", { class: "btn", type: "button", style: "flex:1", onclick: function () { choose(E.act("wait")); } }, "Wait")));
      return;
    }
    bar.appendChild(h("div", { class: "bar-row" }, pathToggle(), h("span", { class: "legend" }, "Solid: live hero · Dashed: echo · Number: its round")));
  }

  /* ---------- Input ---------- */
  function onTile(i) {
    if (!G.resolver) return;
    var st = G.state, side = G.turnSide;
    var u = st.units[st.live[side]];
    var opts = E.liveOptions(st, side);
    var pick = null;
    opts.forEach(function (a) {
      if (a.k === "strike" && E.step(u.pos, a.d) === i) pick = a;
    });
    if (!pick) opts.forEach(function (a) { if (a.k === "move" && E.step(u.pos, a.d) === i) pick = a; });
    if (!pick && i === u.pos) pick = E.act("wait");
    if (!pick) { K.Sound.play("error"); return; }
    choose(pick);
  }
  function choose(a) {
    if (!G.resolver) return;
    var r = G.resolver; G.resolver = null;
    r(a);
  }

  /* ---------- Animation of events ---------- */
  async function showEvents(ev, label) {
    var moved = false, notes = [];
    for (var k = 0; k < ev.length; k++) {
      var e = ev[k];
      if (e.t === "move") moved = true;
      if (e.t === "strike" && e.hits.length) {
        var from = e.from, to = E.step(from, e.d);
        var ln = sv("line", { x1: cx(from), y1: cy(from), x2: cx(to), y2: cy(to), class: "fx-strike" });
        G.layers.fx.appendChild(ln);
        setTimeout(function (n) { return function () { n.remove(); }; }(ln), 350);
        K.Sound.play("hit");
      }
      if (e.t === "ko") {
        var u = G.state.units[e.id];
        var who = E.sideName(u.side) + "'s " + (u.live ? "hero" : "round-" + u.round + " echo");
        if (e.why === "paradox") { notes.push("<b>Paradox!</b> " + who + " was blocked and glitched out."); K.Sound.play("zap"); }
        else if (e.why === "struck") { notes.push("<b>Struck!</b> " + who + " is out for this round."); }
        else if (e.why === "crushed") { notes.push("<b>Crushed!</b> A door slammed on " + who + "."); K.Sound.play("hit"); K.shake(K.$("#stage")); }
        else if (e.why === "fades") { notes.push(who + " fades, as it did when it was struck."); }
      }
      if (e.t === "door") K.Sound.play(e.open ? "reveal" : "error");
    }
    if (notes.length) G.say = notes.join(" ");
    render();
    if (moved) { K.Sound.play("move"); await K.sleep(300); }
    if (notes.length) await K.sleep(650);
  }

  async function showScore(res) {
    G.say = "Round " + res.round + ": " + E.sideName(0) + " <b>+" + res.gained[0] + "</b> · " + E.sideName(1) + " <b>+" + res.gained[1] + "</b>";
    res.held.forEach(function (hd) {
      var t = sv("text", { x: cx(hd.pad), y: cy(hd.pad) - 18, "text-anchor": "middle", class: "float-pts", fill: COLORS[hd.side], text: "+" + hd.value });
      G.layers.fx.appendChild(t);
      if (t.animate) try { t.animate([{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(-16px)", opacity: 0 }], { duration: 1300, fill: "forwards" }); } catch (e2) {}
      setTimeout(function () { t.remove(); }, 1400);
    });
    K.Sound.play("score");
    render();
    await K.sleep(1400);
  }

  /* ---------- Turn flow ---------- */
  function waitHuman(side) {
    return new Promise(function (resolve) {
      G.turnSide = side;
      G.acting = G.state.live[side];
      G.resolver = resolve;
      render();
    });
  }

  async function runGame(token) {
    var st = G.state;
    var lastRound = 0;
    while (st.phase !== "over") {
      if (token !== G.token) return;
      if (st.round !== lastRound) {
        lastRound = st.round;
        render();
        await K.banner("ROUND " + st.round, { tone: "accent", sub: st.round === 1 ? "Six ticks. Grab gems." : "Your round-" + (st.round - 1) + " hero is now an echo", ms: 1300 });
        if (token !== G.token) return;
        if (st.round === 2) G.say = "Dotted lines show where every <b>echo</b> will go this round, with tick numbers.";
        else if (st.round === 1) G.say = G.cfg.mode === "local" ? "Cyan starts at the bottom, Magenta at the top." : "You are <b>Cyan</b>, at the bottom.";
      }
      var auto = E.stepAuto(st);
      if (auto) {
        if (auto.type === "echoes") await showEvents(auto.ev);
        else if (auto.type === "score") await showScore(auto.res);
        continue;
      }
      var who = E.nextActor(st);
      if (who !== 0 && who !== 1) continue;
      var a;
      if (G.human[who]) {
        if (G.cfg.mode === "local") G.say = "<b>" + E.sideName(who) + "</b>, your move.";
        a = await waitHuman(who);
        if (token !== G.token) return;
      } else {
        G.thinking = who; G.acting = st.live[who];
        render();
        await K.sleep(280);
        if (token !== G.token) return;
        a = E.bots.action(st, who, G.level, G.rand);
        G.thinking = null;
      }
      G.acting = st.live[who];
      var ev = E.applyLive(st, who, a);
      if (a.k === "wait") K.Sound.play("tick");
      await showEvents(ev);
      G.acting = -1;
    }
    if (token !== G.token) return;
    await endGame(token);
  }

  async function endGame(token) {
    var st = G.state;
    render();
    var youWon = G.cfg.mode === "bot" ? st.winner === 0 : null;
    await K.banner(st.winner === "draw" ? "DRAW" : E.sideName(st.winner).toUpperCase() + " WINS", { tone: st.winner === 1 ? "bad" : "accent", ms: 1500 });
    if (token !== G.token) return;
    var rows = st.roundScores.map(function (g, k) { return ["Round " + (k + 1), g[0] + " – " + g[1]]; });
    rows.push(["Total (Cyan – Magenta)", st.scores[0] + " – " + st.scores[1]]);
    var choice = await K.gameOver({
      title: G.cfg.mode === "bot" ? (st.winner === "draw" ? "A draw" : youWon ? "You win!" : "You lose") : (st.winner === "draw" ? "A draw" : E.sideName(st.winner) + " wins"),
      tone: youWon === false ? "bad" : "good",
      text: st.reason,
      stats: rows,
      reviewLabel: "Look at the board"
    });
    if (token !== G.token) return;
    if (choice === "rematch") restart();
  }

  /* ---------- Lifecycle ---------- */
  function start(cfg) {
    G.cfg = cfg;
    G.level = cfg.difficulty || "normal";
    G.human = cfg.mode === "local" ? [true, true] : [true, false];
    G.showPaths = K.store.get("paths", true);
    newMatch();
  }
  function newMatch() {
    G.token++;
    G.state = E.newGame();
    G.rand = E.rng((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0);
    G.resolver = null; G.say = ""; G.acting = -1; G.thinking = null;
    K.showScreen("game");
    buildBoard();
    render();
    runGame(G.token);
  }
  function restart() {
    K.$all(".cover,.modal-wrap,.banner").forEach(function (n) { n.remove(); });
    newMatch();
  }
  function quit() { G.token++; G.resolver = null; }

  window.__echoesDebug = { G: G };

  K.init({
    ns: "echoes",
    title: "Echoes",
    tagline: "Your past turns come back to fight for you. Plan across time, and break your rival's.",
    art: TITLE_ART,
    rules: RULES,
    options: [
      { id: "mode", label: "Opponent", default: "bot", choices: [{ v: "bot", t: "Bot" }, { v: "local", t: "Friend, same phone" }],
        note: function (c) { return c.mode === "local" ? "Nothing is hidden, so just take turns on the same screen." : null; } },
      { id: "difficulty", label: "Bot level", default: "normal", choices: [{ v: "easy", t: "Easy" }, { v: "normal", t: "Normal" }, { v: "hard", t: "Hard" }], showIf: function (c) { return c.mode === "bot"; },
        note: function (c) { return c.difficulty === "hard" ? "Searches deep and plans across rounds." : c.difficulty === "easy" ? "Short-sighted. Good for learning how echoes work." : "Plans a few ticks ahead."; } }
    ],
    onStart: start,
    onRestart: restart,
    onQuit: quit,
    menuNote: function () { return G.state ? "Round " + G.state.round + ", tick " + G.state.tick + "." : ""; }
  });
})();

</script>
</body>
</html>
