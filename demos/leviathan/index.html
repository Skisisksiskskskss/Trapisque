<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leviathan Hunt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* ---------- Shared game kit: layout shell, controls, overlays ----------
   Each game sets its own palette and fonts by overriding these tokens on :root. */
:root{
  --bg:#101318; --bg-2:#161a21; --surface:#1d222b; --surface-2:#262c37; --line:#343b48;
  --ink:#eef1f5; --muted:#a3abb8; --accent:#f2c14e; --accent-ink:#17130a;
  --good:#47d18c; --bad:#ff6b5e; --p1:#5aa2ff; --p2:#ff6b5e;
  --font-display:system-ui,sans-serif; --font-body:system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:16px; --radius-sm:10px;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
  color-scheme:dark;
}
[hidden]{display:none !important}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg);-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}

/* ---------- Title screen ---------- */
.title-screen{overflow-y:auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:20px 28px;align-items:center}
.title-inner{width:100%;max-width:460px;display:flex;flex-direction:column;gap:20px;margin:auto 0}
.title-art{display:flex;justify-content:center}
.title-art svg{width:min(70vw,260px);height:auto}
.title-name{font-family:var(--font-display);font-size:clamp(2.3rem,9vw,3.3rem);line-height:.98;margin:0;text-align:center;letter-spacing:-.01em}
.title-tag{color:var(--muted);text-align:center;margin:0;font-size:1.02rem}
.opt-group{display:flex;flex-direction:column;gap:7px}
.opt-label{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--bg-2);border:1px solid var(--line);border-radius:14px}
.seg button{border:0;background:transparent;border-radius:10px;padding:10px 6px;min-height:44px;font-weight:650;font-size:.95rem;color:var(--muted);line-height:1.15}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 2px 8px rgba(0,0,0,.25)}
.opt-note{font-size:.86rem;color:var(--muted);margin:0}
.title-actions{display:flex;flex-direction:column;gap:10px;margin-top:4px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:1rem;line-height:1.1;transition:transform .08s, background .15s, border-color .15s, opacity .15s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent}
.btn-danger{background:var(--bad);border-color:var(--bad);color:#160807}
.btn-sm{min-height:38px;padding:7px 14px;font-size:.9rem}
.btn-wide{width:100%}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;flex:none}
.icon-btn svg{width:22px;height:22px}

/* ---------- Game screen frame ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:10px var(--gutter-r) 8px var(--gutter-l);min-height:60px}
.topbar .status{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.topbar .status-main{font-family:var(--font-display);font-size:1.15rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .status-sub{font-size:.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:4px var(--gutter-r) 4px var(--gutter-l)}
.stage > svg, .stage > .board{max-width:100%;max-height:100%}
.actionbar{padding:8px var(--gutter-r) 12px var(--gutter-l);display:flex;flex-direction:column;gap:8px}
.action-row{display:flex;gap:8px;align-items:stretch}
.action-row > *{flex:1}
.hint-line{font-size:.9rem;color:var(--muted);text-align:center;min-height:1.3em;margin:0}

/* ---------- Overlays ---------- */
.cover{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  padding:24px var(--gutter-r) 24px var(--gutter-l);background:var(--bg);animation:kit-fade .18s ease-out}
.cover .cover-badge{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:2px solid var(--line)}
.cover .cover-badge svg{width:42px;height:42px}
.cover h2{font-family:var(--font-display);font-size:clamp(1.9rem,8vw,2.6rem);margin:0;line-height:1.05}
.cover p{margin:0;color:var(--muted);max-width:32ch}
.cover .btn{margin-top:10px;min-width:220px}
.modal-wrap{position:absolute;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,6,10,.62);animation:kit-fade .15s ease-out}
@media (min-width:640px){ .modal-wrap{align-items:center} }
.modal{width:100%;max-width:560px;max-height:88%;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.4);animation:kit-rise .2s ease-out}
@media (min-width:640px){ .modal{border-radius:22px} }
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 18px 8px}
.modal-head h2{flex:1;margin:0;font-family:var(--font-display);font-size:1.45rem;line-height:1.1}
.modal-body{padding:6px 18px 12px;overflow-y:auto;min-height:0;user-select:text;-webkit-user-select:text}
.modal-actions{display:flex;flex-direction:column;gap:8px;padding:10px 18px calc(16px + env(safe-area-inset-bottom, 0px))}
.banner{position:absolute;left:0;right:0;top:38%;z-index:45;display:flex;flex-direction:column;align-items:center;pointer-events:none;text-align:center;padding:0 var(--gutter-r) 0 var(--gutter-l)}
.banner-text{font-family:var(--font-display);font-size:clamp(2.6rem,13vw,4.6rem);line-height:1;padding:10px 22px;border-radius:18px;color:var(--ink);text-shadow:0 4px 24px rgba(0,0,0,.55);animation:kit-pop .9s cubic-bezier(.2,.9,.3,1.3) both}
.banner-sub{margin-top:8px;font-weight:700;color:var(--ink);background:rgba(0,0,0,.55);padding:6px 12px;border-radius:999px;animation:kit-fade .3s .15s both}
.banner.tone-good .banner-text{color:var(--good)}
.banner.tone-bad .banner-text{color:var(--bad)}
.banner.tone-accent .banner-text{color:var(--accent)}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:46;max-width:calc(100% - 32px);padding:9px 16px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:650;font-size:.94rem;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:kit-drop .2s ease-out;text-align:center}
.shake{animation:kit-shake .38s linear}
@keyframes kit-fade{from{opacity:0}to{opacity:1}}
@keyframes kit-rise{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes kit-drop{from{transform:translate(-50%,-10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes kit-pop{0%{transform:scale(.4);opacity:0}25%{transform:scale(1.08);opacity:1}75%{transform:scale(1);opacity:1}100%{transform:scale(1.02);opacity:0}}
@keyframes kit-shake{0%,100%{transform:none}20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,2px)}}
@media (prefers-reduced-motion: reduce){
  .banner-text{animation-duration:.01s}
  .shake{animation:none}
}

/* ---------- Rules text ---------- */
.rules h3{font-family:var(--font-display);font-size:1.15rem;margin:16px 0 6px}
.rules h3:first-child{margin-top:4px}
.rules p{margin:0 0 8px;color:var(--ink)}
.rules ul,.rules ol{margin:0 0 10px;padding-left:1.2em;display:flex;flex-direction:column;gap:5px}
.rules li::marker{color:var(--muted)}
.rules .tip{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:.92rem}
.rules b{color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0 0 10px;align-items:start}
.kv dt{font-weight:750;white-space:nowrap}
.kv dd{margin:0;color:var(--muted)}
.result-stats{display:grid;grid-template-columns:1fr auto;gap:6px 16px;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.result-stats span:nth-child(even){font-weight:750;text-align:right}

/* Leviathan Hunt: a moonlit sea. Four brightly painted boats, one crimson Leviathan, red haze for doubt.
   One deliberate dark look; every color is set here. */
:root{
  --bg:#06111c; --bg-2:#0a1b2b; --surface:#0f2438; --surface-2:#163149; --line:#24425e;
  --ink:#e9f1f7; --muted:#93a9bd; --accent:#f2b84b; --accent-ink:#1b1206;
  --good:#4fd1c5; --bad:#ff4f6d; --p1:#f2b84b; --p2:#ff4f6d;
  --sea:#0e2a42; --sea-2:#10304b; --sea-n:#0b2034; --monster:#d61f52; --beam:#ffe08a;
  --pip:#5eead4; --hask:#f2b84b; --marta:#c4a1ff; --lumen:#fff1c1;
  --font-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
body{background:radial-gradient(120% 70% at 50% 0%, #0d2338 0%, var(--bg) 62%)}
.title-name{font-weight:400;letter-spacing:.02em;color:var(--ink);text-shadow:0 4px 0 #0b1622, 0 8px 24px rgba(0,0,0,.5)}
.title-name .r{color:var(--monster)}
.title-tag{max-width:30ch;margin-inline:auto}
.title-crew{display:flex;justify-content:center;gap:8px;margin-top:-6px}
.title-crew figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:800;color:var(--muted)}
.title-crew svg{width:48px;height:48px;border-radius:12px;background:var(--surface-2);border:2px solid var(--line)}
.btn{font-weight:800}
.btn-primary{box-shadow:0 3px 0 #9a6a14}
.topbar .status-main{font-size:1.25rem;letter-spacing:.02em}
.scores{display:flex;gap:6px;flex:none}
.chip{display:flex;align-items:center;gap:5px;padding:6px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:800;font-size:.86rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip svg{width:16px;height:16px}
.chip.hits{color:var(--accent)}
.chip.kills{color:var(--bad)}

/* the night sky: how close dawn is */
.sky{position:relative;height:16px;margin:0 var(--gutter-r) 2px var(--gutter-l);border-radius:8px;overflow:hidden;
  background:linear-gradient(90deg,#0a1530 0%,#1d2252 45%,#5b2f63 75%,#ff9a5a 100%);border:1px solid var(--line)}
.sky .done{position:absolute;inset:0 auto 0 0;background:rgba(255,255,255,.08)}
.sky .tick{position:absolute;top:4px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--bad);box-shadow:0 0 6px var(--bad)}
.sky .now{position:absolute;top:1px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#f4f1e1;box-shadow:0 0 8px #f4f1e1;transition:left .5s}
.sky .sun{position:absolute;right:3px;top:2px;width:10px;height:10px;border-radius:50%;background:#ffd166}

#board{width:100%;height:100%;display:block;touch-action:manipulation}
.t-sea{stroke:rgba(120,180,220,.07);stroke-width:1}
.t-reef{fill:#12454f;stroke:rgba(140,230,220,.25);stroke-width:1}
.t-island{fill:#c9b27a;stroke:#8d7a4a;stroke-width:1.6}
.wave{fill:none;stroke:rgba(150,200,235,.13);stroke-width:1.2;stroke-linecap:round}
.zone-n{fill:rgba(255,79,109,.05)}

/* highlights */
.hl-dot{fill:var(--good);stroke:#0b1622;stroke-width:1.4}
.hl-dot.ram{fill:var(--accent)}
.hl-ram{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-dasharray:3 2}
.hl-cross{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round}
.hl-cross.dim{opacity:.4}
.hl-cross-fill{fill:rgba(242,184,75,.16)}
.hl-beam{stroke:var(--beam);stroke-width:5;stroke-linecap:round;opacity:.18}
.hl-beam-tile{fill:rgba(255,224,138,.12);stroke:rgba(255,224,138,.5);stroke-width:1}
.hl-lamp{fill:#ffe08a;stroke:#0b1622;stroke-width:1.6}
.hl-area{fill:rgba(94,234,212,.08);stroke:rgba(94,234,212,.45);stroke-width:1;stroke-dasharray:3 3}
.hl-area.net{fill:rgba(196,161,255,.1);stroke:rgba(196,161,255,.55)}
.hl-self{fill:none;stroke:#fff;stroke-width:2.4;stroke-dasharray:5 4}
.tap-tag rect{fill:#fff7e6;stroke:#0b1622;stroke-width:1.4}
.tap-tag text{fill:#0b1622;font:900 7.5px var(--font-body);letter-spacing:.06em}
.hl-swim{fill:#6ee7b7;stroke:#0b1622;stroke-width:1.4}
.hl-dash{fill:#fbbf24;stroke:#0b1622;stroke-width:1.4}
.hl-lurk{fill:none;stroke:#6ee7b7;stroke-width:2;stroke-dasharray:3 3}
.hl-start{fill:rgba(255,79,109,.16);stroke:rgba(255,79,109,.55);stroke-width:1}
.hl-pending{fill:rgba(255,255,255,.18);stroke:#fff;stroke-width:2.6}
.haze{fill:rgba(255,79,109,.26);stroke:none;animation:lev-murk 2.6s ease-in-out infinite}
.haze.weak{fill:rgba(255,79,109,.14)}
@keyframes lev-murk{0%,100%{opacity:1}50%{opacity:.72}}
.wake circle{fill:none;stroke:rgba(233,241,247,.75);stroke-width:1.4}
.buoy-light{animation:lev-blink 1.4s steps(2,end) infinite}
@keyframes lev-blink{50%{fill:#7a5a10}}

/* units */
.unit{transition:transform .32s cubic-bezier(.3,.7,.3,1)}
.boat-art{transition:opacity .3s}
.ship .sel{fill:none;stroke:#fff;stroke-width:2.2;opacity:0}
.ship.selected .sel{opacity:1}
.ship.selected .boat-art{animation:lev-bob 1.2s ease-in-out infinite}
@keyframes lev-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
.ship.done .boat-art{opacity:.55}
.ship.sunk .boat-art{opacity:.25;filter:grayscale(1)}
.ship.target-ring .sel{opacity:1;stroke:var(--bad);stroke-width:2.6}
.hp-pip{stroke:#0b1622;stroke-width:1}
.hp-pip.lost{fill:#3d2b14 !important}
.monster.hidden-from-hunters{opacity:.55}
.monster .glow{fill:rgba(214,31,82,.22)}
.trail{fill:none;stroke:#ff8fa8;stroke-width:2;stroke-dasharray:4 4;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.trail-dot{fill:#ff8fa8;stroke:#3d0614;stroke-width:1}
.trail-num{fill:#3d0614;font:800 7px var(--font-body)}

/* speech bubbles */
.bubble rect{fill:#fff7e6;stroke:#0b1622;stroke-width:1.5}
.bubble path{fill:#fff7e6;stroke:#0b1622;stroke-width:1.5;stroke-linejoin:round}
.bubble text{fill:#0b1622;font:800 8.4px var(--font-body)}
.bubble.monster rect,.bubble.monster path{fill:#ffd6de}
.bubble{animation:lev-pop .25s cubic-bezier(.2,.9,.3,1.4)}
@keyframes lev-pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

/* effects */
.fx-ping{fill:none;stroke:var(--good);stroke-width:2.5}
.fx-beam{stroke:var(--beam);stroke-width:9;stroke-linecap:round;opacity:.55}
.fx-harpoon{stroke:#e9f1f7;stroke-width:2.4;stroke-linecap:round}
.fx-hit{fill:rgba(242,184,75,.45);stroke:var(--accent);stroke-width:2}
.fx-splash{fill:none;stroke:#cde7f7;stroke-width:2}
.fx-net{fill:rgba(196,161,255,.28);stroke:#c4a1ff;stroke-width:1.6}

/* action bar */
#screen-game .actionbar{gap:7px;padding-top:4px}
.hint-line{font-size:.9rem;color:var(--muted);text-align:center;min-height:2.5em;margin:0;line-height:1.25;display:flex;align-items:center;justify-content:center}
.hint-line b{color:var(--ink)}
.crew{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.crewcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px 5px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.crewcard svg.face{width:40px;height:40px;border-radius:10px;background:var(--surface-2)}
.crewcard .nm{font-size:.74rem;font-weight:900;line-height:1.1}
.crewcard .acts{display:flex;gap:4px;align-items:center;font-size:.66rem;color:var(--muted);font-weight:800}
.crewcard .acts i{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;background:var(--surface-2);font-style:normal}
.crewcard .acts i svg{width:12px;height:12px}
.crewcard .acts i.used{opacity:.25}
.crewcard .hp{position:absolute;top:4px;right:5px;font-size:.66rem;font-weight:900;color:var(--bad)}
.crewcard[aria-pressed="true"]{border-color:var(--cc,var(--accent));background:var(--surface-2);box-shadow:0 0 0 1px var(--cc,var(--accent)) inset}
.crewcard.sunk{opacity:.35}
.crewcard.done{opacity:.6}
.bar-row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.orders{display:flex;align-items:center;gap:5px;font-size:.74rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.orders i{width:13px;height:17px;border-radius:4px 4px 6px 6px;background:var(--accent);box-shadow:0 0 8px rgba(242,184,75,.6);border:1.5px solid #0b1622}
.orders i.used{background:#2a3b4d;box-shadow:none}
.eye{display:inline-flex;align-items:center;gap:5px;min-height:40px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:800;font-size:.82rem}
.eye svg{width:18px;height:18px}
.eye[aria-pressed="true"]{color:#ff9fb0;border-color:rgba(255,79,109,.5)}
.bar-row .btn{min-height:42px;padding:8px 14px}
.legend{display:flex;gap:10px;font-size:.8rem;color:var(--muted);font-weight:700}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;border:1.5px solid #0b1622}
.recap{font-size:.92rem;margin:0;text-align:center;min-height:1.3em}
.recap b{color:var(--bad)}
.who{display:flex;align-items:center;gap:10px;justify-content:center}
.who svg{width:44px;height:44px;border-radius:12px;background:var(--surface-2);flex:none}
.cover .badge-row{display:flex;gap:6px}
.cover .badge-row svg{width:52px;height:52px;border-radius:14px;background:var(--surface-2);border:2px solid var(--line)}
.cover .cover-badge{width:auto;height:auto;border:0;background:none}
.cover-kicker{margin:0;font-size:.8rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.rules .crewlist{display:flex;flex-direction:column;gap:10px;margin:8px 0 12px}
.rules .crewlist .who{justify-content:flex-start;align-items:flex-start}
.rules .crewlist p{margin:0;font-size:.92rem;color:var(--muted)}
.rules .crewlist p b{color:var(--ink)}
@media (max-height:720px){
  .crewcard svg.face{width:32px;height:32px}
  .hint-line{min-height:2.3em;font-size:.84rem}
  .sky{height:12px}
  .sky .now{width:10px;height:10px;margin-left:-5px;top:0}
  .sky .tick{top:2px}
}
@media (prefers-reduced-motion: reduce){ .haze,.buoy-light,.ship.selected .boat-art,.bubble{animation:none} .unit{transition:none} }

</style>
</head>
<body>
<div id="app" class="app">
  <section id="screen-title" class="screen title-screen"></section>
  <section id="screen-game" class="screen" hidden>
    <header class="topbar">
      <button id="btn-menu" class="icon-btn" type="button" aria-label="Menu"></button>
      <div class="status"><div class="status-main" id="st-main">Round 1</div><div class="status-sub" id="st-sub"></div></div>
      <div class="scores" id="scores"></div>
    </header>
    <div class="sky" id="sky" aria-hidden="true"></div>
    <div class="stage" id="stage"></div>
    <div class="actionbar" id="actionbar"></div>
  </section>
</div>
<script>
/* Shared game kit: title screen, menus, pass-the-phone covers, banners, sound.
   Exposes window.Kit. No game logic lives here. */
(function (root) {
  "use strict";
  var doc = root.document;
  var NS = "game";
  var reduceMotion = false;
  try { reduceMotion = root.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}

  function $(sel, scope) { return (scope || doc).querySelector(sel); }
  function $all(sel, scope) { return Array.prototype.slice.call((scope || doc).querySelectorAll(sel)); }

  function h(tag, attrs) {
    var node = doc.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
        var v = attrs[k];
        if (v == null || v === false) continue;
        if (k === "class") node.className = v;
        else if (k === "html") node.innerHTML = v;
        else if (k === "text") node.textContent = v;
        else if (k.slice(0, 2) === "on" && typeof v === "function") node.addEventListener(k.slice(2), v);
        else node.setAttribute(k, v === true ? "" : v);
      }
    }
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      if (Array.isArray(c)) c.forEach(function (x) { if (x != null) node.appendChild(typeof x === "string" ? doc.createTextNode(x) : x); });
      else node.appendChild(typeof c === "string" ? doc.createTextNode(c) : c);
    }
    return node;
  }

  var SVGNS = "http://www.w3.org/2000/svg";
  function s(tag, attrs) {
    var node = doc.createElementNS(SVGNS, tag);
    if (attrs) {
      for (var k in attrs) {
        if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
        var v = attrs[k];
        if (v == null || v === false) continue;
        if (k === "text") node.textContent = v;
        else if (k.slice(0, 2) === "on" && typeof v === "function") node.addEventListener(k.slice(2), v);
        else node.setAttribute(k, v);
      }
    }
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      if (Array.isArray(c)) c.forEach(function (x) { if (x) node.appendChild(x); });
      else node.appendChild(c);
    }
    return node;
  }

  var store = {
    get: function (k, d) {
      try { var v = root.localStorage.getItem(NS + ":" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; }
    },
    set: function (k, v) { try { root.localStorage.setItem(NS + ":" + k, JSON.stringify(v)); } catch (e) {} }
  };

  var speed = 1;
  function sleep(ms) {
    var t = reduceMotion ? Math.min(ms, 80) : ms * speed;
    return new Promise(function (r) { setTimeout(r, t); });
  }
  function frame() { return new Promise(function (r) { root.requestAnimationFrame(function () { r(); }); }); }

  /* ---------- Sound: tiny WebAudio synth, starts after the first tap ---------- */
  var Sound = (function () {
    var ctx = null, master = null, on = true;
    function ensure() {
      if (ctx) { if (ctx.state === "suspended") ctx.resume(); return ctx; }
      var AC = root.AudioContext || root.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.55;
      master.connect(ctx.destination);
      return ctx;
    }
    function tone(freq, dur, opts) {
      opts = opts || {};
      var c = ensure(); if (!c) return;
      var t0 = c.currentTime + (opts.delay || 0);
      var o = c.createOscillator();
      var g = c.createGain();
      o.type = opts.type || "sine";
      o.frequency.setValueAtTime(freq, t0);
      if (opts.to) o.frequency.exponentialRampToValueAtTime(Math.max(20, opts.to), t0 + dur);
      var peak = opts.gain == null ? 0.25 : opts.gain;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + Math.min(0.02, dur / 4));
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(master);
      o.start(t0); o.stop(t0 + dur + 0.05);
    }
    function noise(dur, opts) {
      opts = opts || {};
      var c = ensure(); if (!c) return;
      var t0 = c.currentTime + (opts.delay || 0);
      var len = Math.max(1, Math.floor(c.sampleRate * dur));
      var buf = c.createBuffer(1, len, c.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = c.createBufferSource();
      src.buffer = buf;
      var f = c.createBiquadFilter();
      f.type = opts.filter || "lowpass";
      f.frequency.value = opts.freq || 1200;
      var g = c.createGain();
      g.gain.setValueAtTime(opts.gain == null ? 0.3 : opts.gain, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t0); src.stop(t0 + dur + 0.05);
    }
    var lib = {
      tap: function () { tone(660, 0.06, { type: "triangle", gain: 0.12 }); },
      select: function () { tone(520, 0.07, { type: "triangle", gain: 0.16 }); tone(780, 0.08, { type: "triangle", gain: 0.12, delay: 0.05 }); },
      move: function () { tone(300, 0.12, { type: "sine", to: 420, gain: 0.16 }); },
      slide: function () { noise(0.16, { freq: 900, gain: 0.12 }); },
      error: function () { tone(180, 0.16, { type: "square", gain: 0.08 }); },
      hit: function () { noise(0.22, { freq: 700, gain: 0.45 }); tone(140, 0.25, { type: "sawtooth", to: 60, gain: 0.22 }); },
      miss: function () { noise(0.3, { freq: 2400, filter: "bandpass", gain: 0.22 }); },
      splash: function () { noise(0.45, { freq: 1600, gain: 0.35 }); tone(220, 0.3, { to: 90, gain: 0.08 }); },
      ping: function () { tone(1320, 0.5, { type: "sine", gain: 0.2 }); tone(1320, 0.6, { type: "sine", gain: 0.07, delay: 0.32 }); },
      contact: function () { tone(880, 0.16, { type: "square", gain: 0.1 }); tone(880, 0.16, { type: "square", gain: 0.1, delay: 0.2 }); tone(1175, 0.3, { type: "square", gain: 0.1, delay: 0.4 }); },
      reveal: function () { tone(392, 0.12, { type: "triangle", gain: 0.16 }); tone(587, 0.18, { type: "triangle", gain: 0.16, delay: 0.1 }); },
      roar: function () { tone(110, 0.7, { type: "sawtooth", to: 55, gain: 0.25 }); noise(0.6, { freq: 400, gain: 0.25 }); },
      liar: function () { tone(220, 0.12, { type: "square", gain: 0.14 }); tone(165, 0.35, { type: "square", gain: 0.14, delay: 0.12 }); },
      win: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.22, { type: "triangle", gain: 0.16, delay: i * 0.11 }); }); },
      lose: function () { [392, 330, 262, 196].forEach(function (f, i) { tone(f, 0.28, { type: "triangle", gain: 0.14, delay: i * 0.14 }); }); },
      tick: function () { tone(1000, 0.03, { type: "square", gain: 0.05 }); },
      whoosh: function () { noise(0.25, { freq: 3000, filter: "bandpass", gain: 0.18 }); },
      score: function () { tone(880, 0.09, { type: "triangle", gain: 0.14 }); tone(1320, 0.14, { type: "triangle", gain: 0.12, delay: 0.07 }); },
      zap: function () { tone(1400, 0.18, { type: "sawtooth", to: 300, gain: 0.1 }); }
    };
    return {
      play: function (name) { if (!on) return; try { var f = lib[name]; if (f) f(); } catch (e) {} },
      unlock: function () { if (on) { try { ensure(); } catch (e) {} } },
      get on() { return on; },
      set on(v) { on = !!v; store.set("sound", on); }
    };
  })();

  function haptic(ms) { try { if (root.navigator.vibrate) root.navigator.vibrate(ms || 12); } catch (e) {} }

  /* ---------- Overlays ---------- */
  var app = null;
  function appRoot() { return app || (app = $("#app")); }

  function cover(opts) {
    opts = opts || {};
    return new Promise(function (resolve) {
      var btn = h("button", { class: "btn btn-primary", type: "button" }, opts.cta || "Tap when ready");
      var node = h("div", { class: "cover" + (opts.className ? " " + opts.className : ""), role: "dialog", "aria-modal": "true" },
        opts.badge ? h("div", { class: "cover-badge", html: opts.badge }) : null,
        opts.kicker ? h("p", { class: "cover-kicker" }, opts.kicker) : null,
        h("h2", null, opts.title || "Pass the phone"),
        opts.text ? h("p", null, opts.text) : null,
        btn);
      btn.addEventListener("click", function () { Sound.unlock(); Sound.play("tap"); node.remove(); resolve(); });
      appRoot().appendChild(node);
      setTimeout(function () { try { btn.focus(); } catch (e) {} }, 30);
    });
  }

  function modal(opts) {
    opts = opts || {};
    return new Promise(function (resolve) {
      var wrap;
      function done(v) { wrap.remove(); doc.removeEventListener("keydown", onKey); resolve(v); }
      function onKey(e) { if (e.key === "Escape" && opts.dismissible !== false) done(null); }
      var body = h("div", { class: "modal-body" + (opts.bodyClass ? " " + opts.bodyClass : "") });
      if (typeof opts.body === "string") body.innerHTML = opts.body; else if (opts.body) body.appendChild(opts.body);
      var actions = h("div", { class: "modal-actions" });
      (opts.actions || [{ label: "Close", value: null }]).forEach(function (a) {
        actions.appendChild(h("button", {
          class: "btn btn-wide " + (a.kind === "primary" ? "btn-primary" : a.kind === "danger" ? "btn-danger" : "btn-ghost"),
          type: "button",
          onclick: function () { Sound.play("tap"); done(a.value); }
        }, a.label));
      });
      var closeBtn = opts.dismissible === false ? null : h("button", { class: "icon-btn", type: "button", "aria-label": "Close", onclick: function () { done(null); },
        html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>' });
      var panel = h("div", { class: "modal", role: "dialog", "aria-modal": "true", "aria-label": opts.title || "Dialog" },
        h("div", { class: "modal-head" }, h("h2", null, opts.title || ""), closeBtn),
        body,
        (opts.actions && opts.actions.length === 0) ? null : actions);
      wrap = h("div", { class: "modal-wrap", onclick: function (e) { if (e.target === wrap && opts.dismissible !== false) done(null); } }, panel);
      appRoot().appendChild(wrap);
      doc.addEventListener("keydown", onKey);
    });
  }

  function banner(text, opts) {
    opts = opts || {};
    var node = h("div", { class: "banner tone-" + (opts.tone || "accent"), "aria-live": "assertive" },
      h("div", { class: "banner-text" }, text),
      opts.sub ? h("div", { class: "banner-sub" }, opts.sub) : null);
    appRoot().appendChild(node);
    var ms = opts.ms || 1100;
    return sleep(ms).then(function () { node.remove(); });
  }

  var toastTimer = null, toastNode = null;
  function toast(text, ms) {
    if (toastNode) toastNode.remove();
    toastNode = h("div", { class: "toast", role: "status" }, text);
    appRoot().appendChild(toastNode);
    clearTimeout(toastTimer);
    var n = toastNode;
    toastTimer = setTimeout(function () { if (n) n.remove(); if (toastNode === n) toastNode = null; }, ms || 1900);
  }

  function shake(node) {
    if (!node || reduceMotion) return;
    node.classList.remove("shake");
    void node.getBoundingClientRect();
    node.classList.add("shake");
    setTimeout(function () { node.classList.remove("shake"); }, 420);
  }

  /* ---------- Title screen with option pickers ---------- */
  var ICONS = {
    menu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
    soundOn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>',
    soundOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>',
    phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>',
    eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    help: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.3a2.6 2.6 0 015 1c0 1.8-2.5 2.2-2.5 3.9M12 17.2v.3"/></svg>'
  };

  var cfg = null;
  var choice = {};

  function visibleOptions() {
    return cfg.options.filter(function (o) { return !o.showIf || o.showIf(choice); });
  }

  function renderTitle() {
    var host = $("#title-options");
    host.innerHTML = "";
    visibleOptions().forEach(function (opt) {
      var seg = h("div", { class: "seg", role: "group", "aria-label": opt.label });
      opt.choices.forEach(function (c) {
        seg.appendChild(h("button", {
          type: "button",
          "aria-pressed": choice[opt.id] === c.v ? "true" : "false",
          onclick: function () {
            Sound.unlock(); Sound.play("tap");
            choice[opt.id] = c.v;
            store.set("choice", choice);
            renderTitle();
          }
        }, c.t));
      });
      var note = opt.note ? opt.note(choice) : null;
      host.appendChild(h("div", { class: "opt-group" },
        h("span", { class: "opt-label" }, opt.label), seg,
        note ? h("p", { class: "opt-note" }, note) : null));
    });
  }

  function showRules() {
    return modal({ title: "How to play", body: cfg.rules, bodyClass: "rules", actions: [{ label: "Got it", value: true, kind: "primary" }] });
  }

  function showScreen(name) {
    $all(".screen").forEach(function (sc) { sc.hidden = sc.id !== "screen-" + name; });
  }

  function init(config) {
    cfg = config;
    NS = config.ns || NS;
    Sound.on = store.get("sound", true);
    var saved = store.get("choice", {});
    choice = {};
    cfg.options.forEach(function (o) {
      var ok = o.choices.some(function (c) { return c.v === saved[o.id]; });
      choice[o.id] = ok ? saved[o.id] : o.default;
    });
    var title = $("#screen-title");
    title.innerHTML = "";
    title.appendChild(h("div", { class: "title-inner" },
      cfg.art ? h("div", { class: "title-art", html: cfg.art }) : null,
      h("h1", { class: "title-name" }, cfg.title),
      h("p", { class: "title-tag" }, cfg.tagline),
      h("div", { id: "title-options", class: "title-options", style: "display:flex;flex-direction:column;gap:14px" }),
      h("div", { class: "title-actions" },
        h("button", { class: "btn btn-primary btn-wide", type: "button", id: "btn-start", onclick: function () {
          Sound.unlock(); Sound.play("select");
          var c = {}; visibleOptions().forEach(function (o) { c[o.id] = choice[o.id]; });
          cfg.onStart(c);
        } }, "Play"),
        h("button", { class: "btn btn-ghost btn-wide", type: "button", onclick: function () { Sound.unlock(); Sound.play("tap"); showRules(); } }, "How to play"))));
    renderTitle();
    showScreen("title");
    var menuBtn = $("#btn-menu");
    if (menuBtn) {
      menuBtn.innerHTML = ICONS.menu;
      menuBtn.onclick = function () { Sound.play("tap"); openMenu(); };
    }
  }

  function openMenu() {
    return modal({
      title: "Paused",
      body: h("p", { style: "margin:0;color:var(--muted)" }, cfg.menuNote ? cfg.menuNote() : "The game is waiting for you."),
      actions: [
        { label: "Resume", value: "resume", kind: "primary" },
        { label: "How to play", value: "rules" },
        { label: Sound.on ? "Sound: on" : "Sound: off", value: "sound" },
        { label: "Restart this match", value: "restart" },
        { label: "Quit to title", value: "quit", kind: "danger" }
      ]
    }).then(function (v) {
      if (v === "rules") return showRules().then(openMenu);
      if (v === "sound") { Sound.on = !Sound.on; if (Sound.on) Sound.play("select"); return openMenu(); }
      if (v === "restart") return confirmAsk("Restart this match?", "The current match will be lost.").then(function (ok) { if (ok && cfg.onRestart) cfg.onRestart(); });
      if (v === "quit") return confirmAsk("Quit to the title screen?", "The current match will be lost.").then(function (ok) { if (ok) quit(); });
    });
  }

  function confirmAsk(title, text) {
    return modal({ title: title, body: h("p", { style: "margin:0;color:var(--muted)" }, text), actions: [
      { label: "Yes", value: true, kind: "danger" }, { label: "Cancel", value: false }] }).then(function (v) { return v === true; });
  }

  function quit() {
    if (cfg.onQuit) cfg.onQuit();
    $all(".cover,.modal-wrap,.banner,.toast").forEach(function (n) { n.remove(); });
    renderTitle();
    showScreen("title");
  }

  function gameOver(opts) {
    Sound.play(opts.tone === "bad" ? "lose" : "win");
    var body = h("div", null,
      opts.text ? h("p", { style: "margin:0 0 10px;color:var(--muted)" }, opts.text) : null,
      opts.stats ? (function () {
        var grid = h("div", { class: "result-stats" });
        opts.stats.forEach(function (row) { grid.appendChild(h("span", null, row[0])); grid.appendChild(h("span", null, String(row[1]))); });
        return grid;
      })() : null);
    return modal({ title: opts.title, body: body, dismissible: false, actions: [
      { label: "Rematch", value: "rematch", kind: "primary" },
      { label: opts.reviewLabel || "Look at the board", value: "review" },
      { label: "Main menu", value: "menu" }] }).then(function (v) {
        if (v === "menu") { quit(); return "menu"; }
        return v;
      });
  }


  /* ---------- Blocky characters: Roblox-style heads and figures drawn as SVG ----------
     portrait(spec) draws a head and shoulders in a 64x64 box.
     figure(spec) draws a whole standing figure in a 40x52 box (x -20..20, y -36..16).
     spec: skin, shirt, pants, hair, hairStyle, hat, hatColor, hatColor2, eyes, brows, mouth,
           beard, beardColor, extras (array), accent. Every part is optional. */
  var OUT = "#0b1622";
  function face(p, ox, oy, k) {
    // ox, oy: top-left of the head box; k: head size (34 for portraits)
    var o = "", sc = k / 34;
    function X(v) { return (ox + v * sc).toFixed(2); }
    function Y(v) { return (oy + v * sc).toFixed(2); }
    function S(v) { return (v * sc).toFixed(2); }
    var eyes = p.eyes || "dot", lx = 11, rx = 23, ey = 15;
    if (eyes === "wide") {
      o += '<circle cx="' + X(lx) + '" cy="' + Y(ey) + '" r="' + S(4.2) + '" fill="#fff" stroke="' + OUT + '" stroke-width="' + S(1.2) + '"/><circle cx="' + X(lx + 0.6) + '" cy="' + Y(ey + 0.4) + '" r="' + S(2.1) + '" fill="' + OUT + '"/>';
      o += '<circle cx="' + X(rx) + '" cy="' + Y(ey) + '" r="' + S(4.2) + '" fill="#fff" stroke="' + OUT + '" stroke-width="' + S(1.2) + '"/><circle cx="' + X(rx + 0.6) + '" cy="' + Y(ey + 0.4) + '" r="' + S(2.1) + '" fill="' + OUT + '"/>';
    } else if (eyes === "squint") {
      o += '<path d="M' + X(lx - 3) + " " + Y(ey) + "h" + S(6) + "M" + X(rx - 3) + " " + Y(ey) + "h" + S(6) + '" stroke="' + OUT + '" stroke-width="' + S(2.2) + '" stroke-linecap="round"/>';
    } else if (eyes === "mask") {
      o += '<rect x="' + X(4) + '" y="' + Y(ey - 4.5) + '" width="' + S(26) + '" height="' + S(8.5) + '" rx="' + S(3) + '" fill="' + (p.maskColor || OUT) + '"/>';
      o += '<ellipse cx="' + X(lx) + '" cy="' + Y(ey) + '" rx="' + S(2.6) + '" ry="' + S(2) + '" fill="#fff"/><ellipse cx="' + X(rx) + '" cy="' + Y(ey) + '" rx="' + S(2.6) + '" ry="' + S(2) + '" fill="#fff"/>';
    } else if (eyes === "shades") {
      o += '<path d="M' + X(4) + " " + Y(ey - 3.5) + "h" + S(26) + "v" + S(3) + "q" + S(-1) + " " + S(5) + " " + S(-6) + " " + S(5) + "q" + S(-5) + " 0 " + S(-6) + " " + S(-4.5) + "h" + S(-2) + "q" + S(-1) + " " + S(4.5) + " " + S(-6) + " " + S(4.5) + "q" + S(-5) + " 0 " + S(-6) + " " + S(-5) + 'z" fill="' + OUT + '"/>';
      o += '<path d="M' + X(7) + " " + Y(ey - 2) + "l" + S(3) + " 0" + '" stroke="#9fb3c8" stroke-width="' + S(1.2) + '" stroke-linecap="round"/>';
    } else {
      o += '<rect x="' + X(lx - 2.4) + '" y="' + Y(ey - 3) + '" width="' + S(4.8) + '" height="' + S(6) + '" rx="' + S(2) + '" fill="' + OUT + '"/>';
      if (eyes !== "patch") o += '<rect x="' + X(rx - 2.4) + '" y="' + Y(ey - 3) + '" width="' + S(4.8) + '" height="' + S(6) + '" rx="' + S(2) + '" fill="' + OUT + '"/>';
      else {
        o += '<path d="M' + X(0) + " " + Y(9) + "L" + X(34) + " " + Y(4) + '" stroke="' + OUT + '" stroke-width="' + S(1.6) + '"/>';
        o += '<rect x="' + X(rx - 4.5) + '" y="' + Y(ey - 4.5) + '" width="' + S(9) + '" height="' + S(9) + '" rx="' + S(3) + '" fill="' + OUT + '"/>';
      }
    }

    G.shipNodes = G.state.ships.map(function (sh, k) { var n = shipNode(k); selHex(n); u.appendChild(n); return n; });
    G.monsterNode = monsterNode();
    u.appendChild(G.monsterNode);
    placeUnits(true);
  }

  function setPos(node, i, instant) {
    if (instant) node.style.transition = "none";
    node.style.transform = "translate(" + cx(i).toFixed(2) + "px," + cy(i).toFixed(2) + "px)";
    if (instant) { void node.getBoundingClientRect(); node.style.transition = ""; }
  }

  function placeUnits(instant) {
    var st = G.state;
    st.ships.forEach(function (sh, k) {
      var n = G.shipNodes[k];
      setPos(n, sh.pos, instant);
      n.classList.toggle("sunk", sh.sunk);
      var hp = n.querySelectorAll(".hp-pip");
      for (var q = 0; q < hp.length; q++) hp[q].classList.toggle("lost", q >= sh.hp);
    });
    var m = G.monsterNode;
    var show = monsterVisible();
    m.style.display = show ? "" : "none";
    if (show && st.monster.pos >= 0) setPos(m, st.monster.pos, instant);
    m.classList.toggle("hidden-from-hunters", G.viewer === "monster" && st.revealedAt !== st.monster.pos && !st.winner);
  }

  function monsterVisible() {
    var st = G.state;
    if (st.monster.pos < 0) return false;
    if (st.winner || G.review) return true;
    if (G.viewer === "monster") return true;
    return st.revealedAt >= 0 && st.revealedAt === st.monster.pos;
  }

  function hexEl(i, cls, rr) { return sv("polygon", { points: hexPts(i, rr || R - 1.6), class: cls }); }

  /* ---------- Speech bubbles ---------- */
  function say(who, pos, text) {
    if (pos < 0 || !G.layers.talk) return;
    var old = G.bubbles[who];
    if (old) old.remove();
    var w = Math.max(34, text.length * 4.7 + 12), bh = 16;
    var x = cx(pos), y = cy(pos) - 24;
    var bx = Math.max(2, Math.min(VBW - w - 2, x - w / 2));
    var flip = y - bh < 2;
    if (flip) y = cy(pos) + 24 + bh;
    var g = sv("g", { class: "bubble" + (who === "monster" ? " monster" : "") });
    g.style.transformOrigin = x.toFixed(1) + "px " + y.toFixed(1) + "px";
    g.appendChild(sv("rect", { x: bx.toFixed(1), y: (y - bh).toFixed(1), width: w.toFixed(1), height: bh, rx: "7" }));
    var tx = Math.max(bx + 8, Math.min(bx + w - 8, x));
    g.appendChild(sv("path", { d: flip ? "M" + (tx - 4) + " " + (y - bh + 0.8) + "l4 -5 4 5z" : "M" + (tx - 4) + " " + (y - 0.8) + "l4 5 4 -5z" }));
    g.appendChild(sv("text", { x: (bx + w / 2).toFixed(1), y: (y - 5).toFixed(1), "text-anchor": "middle", text: text }));
    G.layers.talk.appendChild(g);
    G.bubbles[who] = g;
    setTimeout(function () { if (G.bubbles[who] === g) { g.remove(); delete G.bubbles[who]; } }, 1900);
  }
  function crewSay(k, kind) {
    var c = CREW[k], list = c.lines[kind];
    if (list) say("c" + k, G.state.ships[k].pos, pickLine(list));
  }
  function monsterSay(kind) {
    var st = G.state;
    if (monsterVisible()) say("monster", st.monster.pos, pickLine(MONSTER_LINES[kind]));
  }

  /* ---------- What the selected boat can do ---------- */
  function hunterTargets() {
    var st = G.state, T = { sail: {}, tool: {}, self: null, beams: [], k: G.sel };
    if (G.mode !== "hunters" || !G.resolver || G.locked) return T;
    var k = G.sel, sh = st.ships[k];
    if (!sh || sh.sunk || st.orders < 1) return T;
    if (!sh.moved) {
      var mv = L.shipMoves(st, k);
      Object.keys(mv).forEach(function (t) { T.sail[t] = { type: "move", ship: k, to: +t, path: mv[t] }; });
    }
    if (!sh.acted) {
      var at = L.abilityTargets(st, k);
      if (sh.ability === "ping") T.self = { type: "ping", ship: k };
      else if (sh.ability === "net") T.self = { type: "net", ship: k, target: sh.pos };
      else if (sh.ability === "harpoon") at.forEach(function (t) { T.tool[t] = { type: "harpoon", ship: k, target: t }; });
      else if (sh.ability === "beam") at.forEach(function (d) {
        var tiles = L.beamTiles(st, sh.pos, d);
        T.beams.push({ d: d, tiles: tiles });
        tiles.forEach(function (t) { if (L.dist(sh.pos, t) >= 3 && !T.tool[t]) T.tool[t] = { type: "beam", ship: k, dir: d }; });
      });
    }
    return T;
  }

  function inHaze(t) { var st = G.state; return st.revealedAt >= 0 ? st.revealedAt === t : st.P.indexOf(t) >= 0; }

  function crossMark(g, t, dim) {
    var x = cx(t), y = cy(t);
    g.appendChild(sv("circle", { cx: x.toFixed(1), cy: y.toFixed(1), r: "8", class: "hl-cross-fill" }));
    g.appendChild(sv("circle", { cx: x.toFixed(1), cy: y.toFixed(1), r: "6.5", class: "hl-cross" + (dim ? " dim" : "") }));
    g.appendChild(sv("path", { d: "M" + x.toFixed(1) + " " + (y - 11).toFixed(1) + "v5M" + x.toFixed(1) + " " + (y + 6).toFixed(1) + "v5M" + (x - 11).toFixed(1) + " " + y.toFixed(1) + "h5M" + (x + 6).toFixed(1) + " " + y.toFixed(1) + "h5", class: "hl-cross" + (dim ? " dim" : "") }));
  }

  function tapTag(g, pos, text) {
    var w = text.length * 4.6 + 10, x = cx(pos), y = cy(pos) - 27;
    if (y < 8) y = cy(pos) + 30;
    var bx = Math.max(2, Math.min(VBW - w - 2, x - w / 2));
    var t = sv("g", { class: "tap-tag" });
    t.appendChild(sv("rect", { x: bx.toFixed(1), y: (y - 6).toFixed(1), width: w.toFixed(1), height: "12", rx: "6" }));
    t.appendChild(sv("text", { x: (bx + w / 2).toFixed(1), y: (y + 2.6).toFixed(1), "text-anchor": "middle", text: text }));
    g.appendChild(t);
  }

  /* ---------- Render ---------- */
  function render() {
    var st = G.state;
    if (!st) return;
    var marks = G.layers.marks;
    marks.innerHTML = "";
    var phaseStart = st.phase === "start";
    if (phaseStart && G.viewer === "monster" && G.startPick) L.startZone(st).forEach(function (t) { marks.appendChild(hexEl(t, "hl-start")); });
    var showHaze = !phaseStart && G.haze && !st.winner && !G.review && (G.viewer === "hunters" || G.humanMonster);
    if (showHaze && !(st.revealedAt >= 0 && G.viewer === "hunters")) {
      var weak = st.P.length > 30;
      st.P.forEach(function (t) { marks.appendChild(hexEl(t, "haze" + (weak ? " weak" : ""))); });
    }
    if (st.wake >= 0 && !st.winner) {
      var wg = sv("g", { class: "wake" });
      [6, 11, 16].forEach(function (r, q) { wg.appendChild(sv("circle", { cx: cx(st.wake).toFixed(1), cy: cy(st.wake).toFixed(1), r: String(r), opacity: q === 2 ? ".5" : null })); });
      marks.appendChild(wg);
    }
    st.buoys.forEach(function (b) {
      var g = sv("g", { transform: "translate(" + cx(b.pos).toFixed(1) + " " + (cy(b.pos) + 1).toFixed(1) + ") scale(.85)" });
      g.innerHTML = b.alive ? ART.buoy() : ART.wreck();
      marks.appendChild(g);
    });
    G.targets = hunterTargets();
    renderHighlights(marks);
    G.layers.over.innerHTML = "";
    if (G.review || st.winner) renderTrail(G.layers.over);
    placeUnits(false);
    G.shipNodes.forEach(function (n, k) {
      var sh = st.ships[k];
      var selectable = G.resolver && G.mode === "hunters" && !sh.sunk;
      n.classList.toggle("selected", !!(selectable && G.sel === k));
      n.classList.toggle("done", !sh.sunk && st.phase === "hunters" && sh.moved && sh.acted);
      var strikable = G.mode === "monster" && G.monsterOpts && G.monsterOpts.some(function (o) { return o.type === "strike" && o.ship === k; });
      n.classList.toggle("target-ring", !!strikable);
    });
    renderStatus();
    renderBar();
  }

  function renderHighlights(marks) {
    var st = G.state, T = G.targets;
    if (G.mode === "hunters" && G.resolver && !G.locked) {
      var sh = st.ships[G.sel];
      if (T.self) {
        var area = T.self.type === "ping" ? L.disk(sh.pos, L.CFG.sonarRange) : L.netTiles(st, sh.pos);
        area.forEach(function (t) { if (st.terrain[t] !== L.ISLAND && t !== sh.pos) marks.appendChild(hexEl(t, "hl-area" + (T.self.type === "net" ? " net" : ""), R - 2.2)); });
      }
      T.beams.forEach(function (b) {
        var last = b.tiles[b.tiles.length - 1];
        marks.appendChild(sv("line", { x1: cx(sh.pos).toFixed(1), y1: cy(sh.pos).toFixed(1), x2: cx(last).toFixed(1), y2: cy(last).toFixed(1), class: "hl-beam" }));
        b.tiles.forEach(function (t) { if (L.dist(sh.pos, t) >= 3) marks.appendChild(hexEl(t, "hl-beam-tile", R - 2.4)); });
        var lx = cx(last), ly = cy(last);
        marks.appendChild(sv("circle", { cx: lx.toFixed(1), cy: ly.toFixed(1), r: "6", class: "hl-lamp" }));
        marks.appendChild(sv("path", { d: "M" + (lx - 2.4).toFixed(1) + " " + (ly + 2).toFixed(1) + "h4.8M" + lx.toFixed(1) + " " + (ly - 3.6).toFixed(1) + "v3", stroke: "#0b1622", "stroke-width": "1.4", "stroke-linecap": "round" }));
      });
      var anyHaze = G.haze && st.revealedAt < 0;
      Object.keys(T.tool).forEach(function (t) {
        if (T.tool[t].type !== "harpoon") return;
        var useful = !anyHaze || inHaze(+t);
        if (st.revealedAt >= 0 && +t !== st.revealedAt) return;
        if (useful) crossMark(marks, +t, false);
      });
      Object.keys(T.sail).forEach(function (t) {
        var ram = sh.id === "harpoon" && (st.revealedAt >= 0 ? st.revealedAt === +t : anyHaze && inHaze(+t));
        if (ram) marks.appendChild(hexEl(+t, "hl-ram", R - 3));
        marks.appendChild(sv("circle", { cx: cx(+t).toFixed(1), cy: cy(+t).toFixed(1), r: ram ? "5.5" : "4.6", class: "hl-dot" + (ram ? " ram" : "") }));
      });
      if (T.self) {
        marks.appendChild(sv("circle", { cx: cx(sh.pos).toFixed(1), cy: cy(sh.pos).toFixed(1), r: String(R - 1), class: "hl-self" }));
        tapTag(marks, sh.pos, CREW[G.sel].toolTag);
      }
    }
    if (G.mode === "monster" && G.resolver && !G.locked && G.monsterOpts) {
      G.monsterOpts.forEach(function (o) {
        if (o.type === "swim" && o.to === st.monster.pos) marks.appendChild(sv("circle", { cx: cx(o.to).toFixed(1), cy: cy(o.to).toFixed(1), r: String(R - 2), class: "hl-lurk" }));
        else if (o.type === "swim") marks.appendChild(sv("circle", { cx: cx(o.to).toFixed(1), cy: cy(o.to).toFixed(1), r: "5", class: "hl-swim" }));
        if (o.type === "dash") marks.appendChild(sv("circle", { cx: cx(o.to).toFixed(1), cy: cy(o.to).toFixed(1), r: "5", class: "hl-dash" }));
      });
      if (G.pending) {
        var tile = G.pending.type === "strike" ? st.ships[G.pending.ship].pos : G.pending.to;
        marks.appendChild(hexEl(tile, "hl-pending", R - 2));
      }
    }
    if (G.mode === "start" && G.pending != null) marks.appendChild(hexEl(G.pending, "hl-pending", R - 2));
  }

  function renderTrail(layer) {
    var tr = G.state.monster.trail;
    if (!tr.length) return;
    var d = "";
    tr.forEach(function (p, k) { d += (k ? "L" : "M") + cx(p.pos).toFixed(1) + " " + cy(p.pos).toFixed(1); });
    layer.appendChild(sv("path", { d: d, class: "trail" }));
    var seen = {};
    tr.forEach(function (p) {
      if (seen[p.pos]) return;
      seen[p.pos] = 1;
      layer.appendChild(sv("circle", { cx: cx(p.pos).toFixed(1), cy: cy(p.pos).toFixed(1), r: "6", class: "trail-dot" }));
      layer.appendChild(sv("text", { x: cx(p.pos).toFixed(1), y: (cy(p.pos) + 2.5).toFixed(1), "text-anchor": "middle", class: "trail-num", text: String(p.round) }));
    });
  }

  function renderStatus() {
    var st = G.state;
    var main = "", sub = "";
    if (st.winner) {
      main = st.winner === "hunters" ? "The hunters win" : MONSTER + " wins";
      sub = G.review ? "The red line is " + MONSTER + "'s whole path. Numbers are rounds." : st.reason;
    } else if (st.phase === "start") {
      main = "The hunt begins";
      sub = G.viewer === "monster" ? "Choose where " + MONSTER + " hides" : MONSTER + " is choosing a hiding spot";
    } else {
      var surf = L.CFG.surfaceEvery - (st.round % L.CFG.surfaceEvery);
      if (surf === L.CFG.surfaceEvery) surf = 0;
      main = st.phase === "monster" ? MONSTER + "'s turn" : "Hunters' turn";
      sub = "Round " + st.round + "/" + L.CFG.roundLimit + (surf === 0 ? " · air now" : " · air in " + surf);
    }
    K.$("#st-main").textContent = main;
    K.$("#st-sub").textContent = sub;
    var sc = K.$("#scores");
    sc.innerHTML = "";
    sc.appendChild(h("span", { class: "chip hits", title: "Harpoon hits", html: icon("hits") + "<span>" + st.monster.wounds + "/" + L.CFG.woundsToWin + "</span>" }));
    sc.appendChild(h("span", { class: "chip kills", title: "Targets destroyed", html: icon("kills") + "<span>" + st.monster.kills + "/" + L.CFG.killsToWin + "</span>" }));
    var sky = K.$("#sky");
    if (sky) {
      var n = L.CFG.roundLimit, pct = function (r) { return (100 * (r - 0.5) / n).toFixed(2) + "%"; };
      var html = '<div class="done" style="width:' + pct(Math.min(st.round, n)) + '"></div>';
      for (var r = L.CFG.surfaceEvery; r <= n; r += L.CFG.surfaceEvery) html += '<i class="tick" style="left:' + pct(r) + '"></i>';
      html += '<i class="sun"></i><i class="now" style="left:' + pct(Math.max(1, Math.min(st.round, n))) + '"></i>';
      sky.innerHTML = html;
    }
  }

  /* ---------- Action bar ---------- */
  function hazeButton() {
    return h("button", { class: "eye", type: "button", "aria-pressed": G.haze ? "true" : "false", "aria-label": G.haze ? "Hide the red haze" : "Show the red haze", onclick: function () {
      G.haze = !G.haze; K.store.set("haze", G.haze); K.Sound.play("tap"); render();
    }, html: icon("eye") + "<span>" + (G.state && G.state.phase !== "start" ? G.state.P.length : "") + "</span>" });
  }

  function renderBar() {
    var bar = K.$("#actionbar");
    bar.innerHTML = "";
    var st = G.state;
    if (G.review) {
      bar.appendChild(h("p", { class: "hint-line" }, "The red line is where " + MONSTER + " went. Numbers are rounds."));
      bar.appendChild(h("div", { class: "action-row" },
        h("button", { class: "btn btn-primary", type: "button", onclick: function () { K.Sound.play("select"); restart(); } }, "Rematch"),
        h("button", { class: "btn", type: "button", onclick: function () { K.quit(); } }, "Main menu")));
      return;
    }
    if (G.mode === "start" && G.resolver) {
      bar.appendChild(h("div", { class: "who", html: monsterFace() + '<p class="hint-line" style="margin:0">' + (G.pending == null ? "Tap a red tile in the north to hide there." : "Tap it again, or press Hide here.") + "</p>" }));
      bar.appendChild(h("button", { class: "btn btn-primary btn-wide", type: "button", disabled: G.pending == null, onclick: function () { confirmStart(); } }, "Hide here"));
      return;
    }
    if (G.mode === "monster" && G.resolver) { renderMonsterBar(bar); return; }
    if (G.mode === "hunters" && G.resolver) { renderHunterBar(bar); return; }
    bar.appendChild(h("p", { class: "recap" }, h("span", { html: G.recap || "&nbsp;" })));
    bar.appendChild(crewRow(false));
    var row = h("div", { class: "bar-row" }, h("span", { class: "orders" }, st.phase === "hunters" ? "The hunters are moving" : st.phase === "monster" ? MONSTER + " is moving" : ""));
    if (!st.winner && (G.viewer === "hunters" || G.humanMonster)) row.appendChild(hazeButton());
    bar.appendChild(row);
  }

  function crewRow(active) {
    var st = G.state, row = h("div", { class: "crew" });
    st.ships.forEach(function (sh, k) {
      var c = CREW[k];
      var acts = h("span", { class: "acts" },
        h("i", { class: sh.moved ? "used" : "", title: "Sail", html: icon("sail") }),
        h("i", { class: sh.acted ? "used" : "", title: c.tool, html: icon(sh.ability) }));
      row.appendChild(h("button", {
        class: "crewcard" + (sh.sunk ? " sunk" : "") + (!sh.sunk && st.phase === "hunters" && sh.moved && sh.acted ? " done" : ""), type: "button",
        style: "--cc:" + c.color, "aria-pressed": active && G.sel === k ? "true" : "false", disabled: !active || sh.sunk ? true : null,
        "aria-label": c.name + ", " + c.boat,
        onclick: function () { selectShip(k); }
      }, h("span", { html: face(k) }), h("span", { class: "nm" }, crewName(k)), sh.sunk ? h("span", { class: "acts" }, "sunk") : acts,
        h("span", { class: "hp" }, sh.sunk ? "" : "♥" + sh.hp)));
    });
    return row;
  }

  function hunterHint() {
    var st = G.state, T = G.targets, k = G.sel, sh = st.ships[k], c = CREW[k], nm = crewName(k);
    if (G.recap) return G.recap;
    if (st.orders < 1) return "Out of orders.";
    if (sh.sunk) return "Pick another boat.";
    var canSail = Object.keys(T.sail).length > 0;
    var aim = Object.keys(T.tool).filter(function (t) { return T.tool[t].type !== "harpoon" || !G.haze || inHaze(+t); });
    var canTool = !!T.self || aim.length > 0;
    if (!canSail && !canTool) return "<b>" + nm + "</b> is done this turn. Tap another boat.";
    var parts = [];
    if (canSail) parts.push(sh.id === "harpoon" ? "Tap a dot to sail 1 (a gold dot rams if " + MONSTER + " is there)" : "Tap a dot to sail");
    if (canTool) {
      if (sh.ability === "ping") parts.push("tap Pip's boat to ping");
      else if (sh.ability === "net") parts.push("tap Marta's boat to cast her nets");
      else if (sh.ability === "harpoon") parts.push("tap a target to throw");
      else parts.push("tap a lamp to shine the beam");
    } else if (!sh.acted && sh.ability === "harpoon") parts.push("nothing to throw at from here");
    else if (!sh.acted) parts.push("no clear line for the beam from here");
    var s = parts.join(", ");
    return s.charAt(0).toUpperCase() + s.slice(1) + ".";
  }

  function renderHunterBar(bar) {
    var st = G.state;
    bar.appendChild(h("p", { class: "hint-line" }, h("span", { html: hunterHint() })));
    bar.appendChild(crewRow(true));
    var pips = h("span", { class: "orders" }, "Orders");
    for (var q = 0; q < L.CFG.orders; q++) pips.appendChild(h("i", { class: q < st.orders ? "" : "used" }));
    var right = h("span", { style: "display:flex;gap:6px;align-items:center" }, hazeButton());
    if (G.undo) right.appendChild(h("button", { class: "btn btn-sm", type: "button", onclick: doUndo }, "Undo"));
    right.appendChild(h("button", { class: "btn btn-sm" + (st.orders < 1 ? " btn-primary" : ""), type: "button", onclick: function () { K.Sound.play("tap"); finishHunterTurn(); } }, "End turn"));
    bar.appendChild(h("div", { class: "bar-row" }, pips, right));
  }

  function renderMonsterBar(bar) {
    var st = G.state;
    var p = G.pending;
    var msg;
    if (!p) msg = "Green dot: swim (silent). Gold dot: dash 2 (leaves a wake). Red ring: strike that boat. Ring on you: stay put.";
    else if (p.type === "strike") msg = "Strike " + CREW[p.ship].name + "'s boat? Everyone will see you.";
    else if (p.type === "dash") msg = "Dash here? A wake will show where you started." + (L.buoyAt(st, p.to) ? " You'll eat the buoy and be seen." : "");
    else if (p.to === st.monster.pos) msg = "Stay where you are and lurk.";
    else msg = "Swim here." + (L.buoyAt(st, p.to) ? " You'll eat the buoy and be seen." : "");
    if (st.round % L.CFG.surfaceEvery === 0) msg += " You come up for air after this move.";
    if (st.monster.snagged) msg = "You're tangled in nets: no dashing this turn. " + msg;
    bar.appendChild(h("div", { class: "who", html: monsterFace() + '<p class="hint-line" style="margin:0;text-align:left">' + msg + "</p>" }));
    var row = h("div", { class: "action-row" });
    row.appendChild(h("button", { class: "btn btn-primary", type: "button", disabled: !p, onclick: confirmMonster },
      !p ? "Tap a dot" : p.type === "strike" ? "Strike!" : p.type === "dash" ? "Dash" : p.to === st.monster.pos ? "Lurk" : "Swim"));
    bar.appendChild(row);
    bar.appendChild(h("div", { class: "bar-row" },
      h("div", { class: "legend" },
        h("span", null, h("i", { style: "background:#6ee7b7" }), "Swim"),
        h("span", null, h("i", { style: "background:#fbbf24" }), "Dash"),
        h("span", null, h("i", { style: "background:#ff4f6d" }), "Strike")),
      hazeButton()));
  }

  function selectShip(k) {
    var st = G.state, sh = st.ships[k];
    if (sh.sunk || G.locked) return;
    K.Sound.play("tap");
    G.sel = k;
    G.recap = "";
    render();
  }

  /* ---------- Input ---------- */
  function onTile(i) {
    if (G.locked || !G.resolver) return;
    var st = G.state;
    if (G.mode === "start") {
      if (L.startZone(st).indexOf(i) < 0) { K.Sound.play("error"); K.toast("Hide in the red tiles up north."); return; }
      if (G.pending === i) { confirmStart(); return; }
      G.pending = i; K.Sound.play("tap"); render(); return;
    }
    if (G.mode === "monster") {
      var opt = null;
      G.monsterOpts.forEach(function (o) {
        if (o.type === "strike" && st.ships[o.ship].pos === i) opt = o;
        else if ((o.type === "swim" || o.type === "dash") && o.to === i && !opt) opt = o;
      });
      if (!opt) { K.Sound.play("error"); return; }
      if (G.pending && samePending(G.pending, opt)) { confirmMonster(); return; }
      G.pending = opt; K.Sound.play("tap"); render(); return;
    }
    if (G.mode === "hunters") {
      var T = G.targets;
      if (T.tool[i]) { doHunter(T.tool[i]); return; }
      if (T.sail[i]) { doHunter(T.sail[i]); return; }
      var shipHere = L.shipAt(st, i);
      if (shipHere >= 0) {
        if (shipHere === G.sel && T.self) { doHunter(T.self); return; }
        if (shipHere !== G.sel) { selectShip(shipHere); return; }
        return;
      }
      K.Sound.play("error");
    }
  }

  function samePending(a, b) {
    return a.type === b.type && a.to === b.to && a.ship === b.ship;
  }

  function confirmStart() {
    if (G.pending == null || !G.resolver) return;
    K.Sound.play("select");
    var r = G.resolver; G.resolver = null;
    var pos = G.pending; G.pending = null;
    r(pos);
  }
  function confirmMonster() {
    if (!G.pending || !G.resolver) return;
    K.Sound.play("select");
    var r = G.resolver; G.resolver = null;
    var act = G.pending; G.pending = null;
    G.monsterOpts = null;
    r(act);
  }

  async function doHunter(order) {
    if (G.locked || !G.resolver) return;
    var snap = order.type === "move" ? L.clone(G.state) : null;
    G.undo = null;
    G.recap = "";
    var ev = await runHunterOrder(order);
    if (ev && snap && !ev.some(function (e) { return e.t === "reveal"; }) && G.resolver && G.mode === "hunters") { G.undo = snap; render(); }
  }

  function doUndo() {
    if (!G.undo || G.locked) return;
    var c = L.clone(G.undo);
    G.undo = null;
    Object.keys(c).forEach(function (key) { G.state[key] = c[key]; });
    K.Sound.play("slide");
    placeUnits(true);
    render();
  }

  /* ---------- Animations ---------- */
  function fx(node, ms) {
    G.layers.fx.appendChild(node);
    setTimeout(function () { node.remove(); }, ms || 900);
    return node;
  }
  function animate(node, frames, ms) {
    if (K.reduceMotion || !node.animate) return K.sleep(ms);
    try { node.animate(frames, { duration: ms, easing: "ease-out", fill: "forwards" }); } catch (e) {}
    return K.sleep(ms);
  }

  async function slideShip(k, path) {
    var n = G.shipNodes[k];
    for (var q = 0; q < path.length; q++) {
      setPos(n, path[q], false);
      K.Sound.play("slide");
      await K.sleep(230);
    }
  }

  async function pingFx(k, pos, contact) {
    K.Sound.play("ping");
    var c = sv("circle", { cx: "0", cy: "0", r: (2.6 * HW).toFixed(1), class: "fx-ping" });
    fx(sv("g", { transform: "translate(" + cx(pos).toFixed(1) + " " + cy(pos).toFixed(1) + ")" }, c), 1100);
    await animate(c, [{ transform: "scale(.08)", opacity: 1 }, { transform: "scale(1)", opacity: 0.2 }], 700);
    crewSay(k, contact ? "yes" : "no");
    if (contact) { K.Sound.play("contact"); await K.banner("CONTACT", { tone: "bad", sub: MONSTER + " is within 2 tiles of Pip", ms: 1100 }); }
    else await K.sleep(500);
  }

  async function beamFx(k, from, tiles, found) {
    K.Sound.play("zap");
    if (!tiles.length) return;
    var last = tiles[tiles.length - 1];
    var ln = fx(sv("line", { x1: cx(from).toFixed(1), y1: cy(from).toFixed(1), x2: cx(last).toFixed(1), y2: cy(last).toFixed(1), class: "fx-beam" }), 1300);
    await animate(ln, [{ opacity: 0 }, { opacity: 0.8 }, { opacity: 0.4 }], 600);
    crewSay(k, found ? "yes" : "no");
    if (found) { K.Sound.play("reveal"); monsterSay("spotted"); await K.banner("SPOTTED", { tone: "bad", sub: "Lumen's beam caught " + MONSTER, ms: 1100 }); }
    else await K.sleep(500);
  }

  async function harpoonFx(k, from, target, hit) {
    K.Sound.play("whoosh");
    var ln = fx(sv("line", { x1: cx(from).toFixed(1), y1: cy(from).toFixed(1), x2: cx(from).toFixed(1), y2: cy(from).toFixed(1), class: "fx-harpoon" }), 900);
    if (!K.reduceMotion) {
      for (var q = 1; q <= 8; q++) {
        ln.setAttribute("x2", (cx(from) + (cx(target) - cx(from)) * q / 8).toFixed(1));
        ln.setAttribute("y2", (cy(from) + (cy(target) - cy(from)) * q / 8).toFixed(1));
        await K.sleep(28);
      }
    }
    if (hit) {
      K.Sound.play("hit");
      fx(sv("circle", { cx: cx(target).toFixed(1), cy: cy(target).toFixed(1), r: "18", class: "fx-hit" }), 900);
      K.shake(K.$("#stage")); K.haptic(40);
      crewSay(k, "yes"); monsterSay("hit");
      await K.banner("HIT!", { tone: "accent", sub: G.state.monster.wounds + " of " + L.CFG.woundsToWin + " hits", ms: 1200 });
    } else {
      K.Sound.play("splash");
      var sp = sv("circle", { cx: "0", cy: "0", r: "16", class: "fx-splash" });
      fx(sv("g", { transform: "translate(" + cx(target).toFixed(1) + " " + cy(target).toFixed(1) + ")" }, sp), 900);
      crewSay(k, "no");
      await animate(sp, [{ transform: "scale(.25)", opacity: 1 }, { transform: "scale(1)", opacity: 0 }], 500);
    }
  }

  async function netFx(k, tiles, snag) {
    K.Sound.play("whoosh");
    var g = sv("g");
    tiles.forEach(function (t) { g.appendChild(hexEl(t, "fx-net", R - 3)); });
    fx(g, 900);
    await animate(g, [{ opacity: 0 }, { opacity: 1 }, { opacity: 0.2 }], 700);
    crewSay(k, snag ? "yes" : "no");
    if (snag) { K.Sound.play("roar"); K.shake(K.$("#stage")); monsterSay("snag"); await K.banner("CAUGHT", { tone: "accent", sub: MONSTER + " can't dash next turn", ms: 1200 }); }
  }

  async function ramFx(k, at, from) {
    var n = G.shipNodes[k];
    var x0 = cx(from), y0 = cy(from), x1 = cx(at), y1 = cy(at);
    crewSay(k, "ram");
    await animate(n, [{ transform: "translate(" + x0 + "px," + y0 + "px)" }, { transform: "translate(" + (x0 + (x1 - x0) * 0.45) + "px," + (y0 + (y1 - y0) * 0.45) + "px)" }, { transform: "translate(" + x0 + "px," + y0 + "px)" }], 420);
    render();
    K.Sound.play("hit"); K.shake(K.$("#stage")); K.haptic(50);
    monsterSay("hit");
    await K.banner("RAMMED!", { tone: "accent", sub: G.state.monster.wounds + " of " + L.CFG.woundsToWin + " hits", ms: 1200 });
  }

  /* Hunter events, seen by whoever is looking. */
  async function animateHunterEvents(ev) {
    for (var q = 0; q < ev.length; q++) {
      var e = ev[q];
      if (e.t === "move") {
        if (e.path.length) { crewSay(e.ship, "sail"); await slideShip(e.ship, e.path); }
      } else if (e.t === "bump") {
        render();
        crewSay(e.ship, "bump"); monsterSay("bump");
        K.Sound.play("roar"); K.shake(K.$("#stage")); K.haptic(30);
        await K.banner("BUMP!", { tone: "bad", sub: "Something huge is right there", ms: 1200 });
      } else if (e.t === "ram") { await ramFx(e.ship, e.at, e.stop); }
      else if (e.t === "ping") { render(); await pingFx(e.ship, e.at, e.contact); }
      else if (e.t === "beam") { render(); await beamFx(e.ship, e.from, e.tiles, e.found); }
      else if (e.t === "harpoon") { await harpoonFx(e.ship, e.from, e.target, e.hit); }
      else if (e.t === "net") { render(); await netFx(e.ship, e.tiles, e.snag); }
      render();
    }
  }

  /* Monster events. publicOnly: show only what the hunters can see. */
  async function animateMonsterEvents(ev, publicOnly) {
    var st = G.state;
    var lines = [];
    var revealed = ev.some(function (e) { return e.t === "reveal"; });
    for (var q = 0; q < ev.length; q++) {
      var e = ev[q];
      if (e.t === "swim") {
        if (!publicOnly) { setPos(G.monsterNode, e.to, false); K.Sound.play("move"); await K.sleep(320); }
        else if (!revealed) lines.push(MONSTER + " swam somewhere. The haze spreads.");
      } else if (e.t === "dash") {
        if (!publicOnly) { setPos(G.monsterNode, e.to, false); K.Sound.play("whoosh"); await K.sleep(380); }
        else { if (!revealed) lines.push("<b>A wake!</b> " + MONSTER + " dashed 2 tiles away from the rings."); render(); K.Sound.play("splash"); await K.sleep(500); }
      } else if (e.t === "strike") {
        render();
        K.Sound.play("hit"); K.shake(K.$("#stage")); K.haptic(50);
        monsterSay("strike");
        setTimeout(function () { crewSay(e.ship, "hurt"); }, 650);
        await K.banner("STRIKE!", { tone: "bad", sub: CREW[e.ship].name + "'s boat is hit", ms: 1300 });
      } else if (e.t === "sunk") {
        render();
        K.Sound.play("splash");
        crewSay(e.ship, "sunk");
        await K.banner("SUNK", { tone: "bad", sub: CREW[e.ship].name + "'s boat went down", ms: 1300 });
      } else if (e.t === "devour") {
        render();
        K.Sound.play("roar"); K.shake(K.$("#stage"));
        monsterSay("devour");
        await K.banner("CHOMP!", { tone: "bad", sub: MONSTER + " ate a buoy", ms: 1300 });
      } else if (e.t === "reveal" && e.why === "surface") {
        render();
        K.Sound.play("roar");
        monsterSay("surface");
        await K.banner("SURFACED", { tone: "bad", sub: "Every 6th round it comes up for air", ms: 1300 });
      }
    }
    G.recap = lines.join(" ");
    render();
  }

  /* ---------- Turn flow ---------- */
  function waitFor(mode, setup) {
    return new Promise(function (resolve) {
      G.mode = mode;
      G.pending = null;
      if (setup) setup();
      G.resolver = resolve;
      render();
    });
  }

  async function humanStart() {
    G.startPick = true;
    var pos = await waitFor("start");
    G.startPick = false;
    return pos;
  }

  async function humanMonsterTurn() {
    var act = await waitFor("monster", function () { G.monsterOpts = L.monsterOptions(G.state); });
    G.mode = null;
    return act;
  }

  function finishHunterTurn() {
    if (!G.resolver || G.mode !== "hunters" || G.locked) return;
    var r = G.resolver; G.resolver = null; G.mode = null; G.undo = null;
    r();
  }

  function shipHasWork(st, k) {
    var sh = st.ships[k];
    if (sh.sunk || st.orders < 1) return false;
    if (!sh.moved && Object.keys(L.shipMoves(st, k)).length) return true;
    if (!sh.acted && L.abilityTargets(st, k).length) return true;
    return false;
  }

  async function runHunterOrder(order) {
    var token = G.token;
    G.locked = true;
    render();
    var ev = L.applyHunter(G.state, order);
    await animateHunterEvents(ev);
    if (token !== G.token) return null;
    G.locked = false;
    var st = G.state;
    if (st.winner || st.orders < 1 || !L.hasAnyOrder(st)) {
      render();
      await K.sleep(500);
      if (token !== G.token) return ev;
      finishHunterTurn();
      return ev;
    }
    if (!shipHasWork(st, G.sel)) {
      for (var j = 1; j <= st.ships.length; j++) { var k = (G.sel + j) % st.ships.length; if (shipHasWork(st, k)) { G.sel = k; break; } }
    }
    render();
    return ev;
  }

  async function humanHunterTurn() {
    var st = G.state;
    G.sel = 1;
    if (!shipHasWork(st, 1)) { for (var k = 0; k < st.ships.length; k++) if (shipHasWork(st, k)) { G.sel = k; break; } }
    if (st.ships[G.sel].sunk) G.sel = st.ships.findIndex(function (x) { return !x.sunk; });
    G.undo = null;
    await waitFor("hunters");
  }

  async function botHunterTurn(token) {
    var st = G.state;
    G.mode = null;
    render();
    await K.sleep(500);
    var n = 0;
    while (!st.winner && st.orders > 0 && n++ < 8) {
      if (token !== G.token) return;
      var o = L.bots.hunterOrder(st, G.level, G.rand);
      if (o.type === "end") break;
      K.$("#st-sub").textContent = "Round " + st.round + " · " + describeBot(o);
      await K.sleep(380);
      if (token !== G.token) return;
      var ev = L.applyHunter(st, o);
      await animateHunterEvents(ev);
      await K.sleep(200);
    }
  }
  function describeBot(o) {
    var nm = crewName(o.ship);
    if (o.type === "move") return nm + " sails";
    if (o.type === "ping") return "Pip pings";
    if (o.type === "harpoon") return "Hask throws";
    if (o.type === "net") return "Marta casts her nets";
    return "Lumen shines the beam";
  }

  async function botMonsterTurn(token) {
    G.mode = null;
    render();
    await K.sleep(650);
    if (token !== G.token) return;
    var act = L.bots.monsterMove(G.state, G.level, G.rand);
    var ev = L.applyMonster(G.state, act);
    await animateMonsterEvents(ev, true);
  }

  async function passTo(viewer) {
    G.viewer = viewer;
    G.pending = null;
    render();
    if (viewer === "monster") {
      await K.cover({ className: "monster-cover", kicker: "Round " + G.state.round, title: MONSTER + "'s turn", text: "Hunters, look away. " + MONSTER + "'s player, take the phone.", cta: "I'm " + MONSTER, badge: '<div class="badge-row">' + monsterFace() + "</div>" });
    } else {
      await K.cover({ className: "hunter-cover", kicker: "Round " + G.state.round, title: "Hunters' turn", text: MONSTER + "'s player, hand the phone over.", cta: "We're the hunters", badge: '<div class="badge-row">' + CREW.map(function (c, k) { return face(k); }).join("") + "</div>" });
    }
  }

  async function runGame(token) {
    var st = G.state;
    var local = G.cfg.mode === "local";
    if (G.humanMonster) {
      if (local) await passTo("monster");
      else { G.viewer = "monster"; render(); }
      if (token !== G.token) return;
      var pos = await humanStart();
      if (token !== G.token) return;
      L.setMonsterStart(st, pos);
    } else {
      L.setMonsterStart(st, L.bots.monsterStart(st, G.level, G.rand));
    }
    render();
    while (!st.winner) {
      if (token !== G.token) return;
      if (st.phase === "monster") {
        if (G.humanMonster) {
          if (local && G.viewer !== "monster") { await passTo("monster"); if (token !== G.token) return; }
          var act = await humanMonsterTurn();
          if (token !== G.token) return;
          G.locked = true;
          var ev = L.applyMonster(st, act);
          await animateMonsterEvents(ev, false);
          G.locked = false;
          if (local && !st.winner) {
            await passTo("hunters");
            if (token !== G.token) return;
            G.recap = "";
            await animateMonsterEvents(ev, true);
          }
        } else {
          await botMonsterTurn(token);
        }
      } else if (st.phase === "hunters") {
        if (G.humanHunters) {
          await humanHunterTurn();
        } else {
          await botHunterTurn(token);
        }
        if (token !== G.token) return;
        G.recap = "";
        L.endHunterTurn(st);
        render();
      } else break;
    }
    if (token !== G.token) return;
    await endGame(token);
  }

  async function endGame(token) {
    var st = G.state;
    G.mode = null; G.resolver = null;
    render();
    if (st.winner === "monster") monsterSay("win");
    else crewSay(1, "yes");
    var youWon = null;
    if (G.cfg.mode === "bot") youWon = (st.winner === "hunters") === (G.cfg.side === "hunters");
    await K.banner(st.winner === "hunters" ? "HUNTERS WIN" : MONSTER.toUpperCase() + " WINS", { tone: st.winner === "hunters" ? "accent" : "bad", ms: 1500 });
    if (token !== G.token) return;
    var title = G.cfg.mode === "bot" ? (youWon ? "You win!" : "You lose") : (st.winner === "hunters" ? "The hunters win" : MONSTER + " wins");
    var choice = await K.gameOver({
      title: title,
      tone: youWon === false ? "bad" : "good",
      text: st.reason,
      stats: [["Harpoon hits", st.monster.wounds + " / " + L.CFG.woundsToWin], ["Targets destroyed", st.monster.kills + " / " + L.CFG.killsToWin], ["Rounds played", st.round]],
      reviewLabel: "See " + MONSTER + "'s path"
    });
    if (token !== G.token) return;
    if (choice === "rematch") restart();
    else if (choice === "review") { G.review = true; render(); }
  }

  /* ---------- Lifecycle ---------- */
  function start(cfg) {
    G.cfg = cfg;
    G.level = cfg.difficulty || "normal";
    G.haze = K.store.get("haze", true) !== false;
    var local = cfg.mode === "local";
    G.humanMonster = local || cfg.side === "monster";
    G.humanHunters = local || cfg.side !== "monster";
    newMatch();
  }

  function newMatch() {
    G.token++;
    var seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
    G.state = L.newGame(seed);
    G.rand = L.rng(seed ^ 0x5bd1e995);
    G.review = false; G.pending = null; G.resolver = null; G.mode = null; G.locked = false; G.recap = ""; G.undo = null;
    if (G.cfg.mode === "local") G.viewer = "monster";
    else G.viewer = G.cfg.side === "monster" ? "monster" : "hunters";
    K.showScreen("game");
    buildBoard();
    render();
    runGame(G.token);
  }

  function restart() {
    K.$all(".cover,.modal-wrap,.banner").forEach(function (n) { n.remove(); });
    newMatch();
  }

  function quit() {
    G.token++;
    G.resolver = null; G.mode = null;
  }

  window.__leviathanDebug = { G: G, runHunterOrder: runHunterOrder, doHunter: doHunter, CREW: CREW };

  K.init({
    ns: "leviathan-hunt",
    title: "Leviathan Hunt",
    tagline: "Four hunters. One hungry Leviathan. Find " + MONSTER + " before dawn.",
    art: TITLE_ART,
    rules: RULES,
    options: [
      { id: "mode", label: "Opponent", default: "bot", choices: [{ v: "bot", t: "Bot" }, { v: "local", t: "Friend, same phone" }],
        note: function (c) { return c.mode === "local" ? "One of you is " + MONSTER + ", the other runs the hunters. Cover screens keep " + MONSTER + " hidden." : null; } },
      { id: "side", label: "You play", default: "hunters", choices: [{ v: "hunters", t: "The hunters" }, { v: "monster", t: MONSTER }], showIf: function (c) { return c.mode === "bot"; } },
      { id: "difficulty", label: "Bot level", default: "normal", choices: [{ v: "easy", t: "Easy" }, { v: "normal", t: "Normal" }, { v: "hard", t: "Hard" }], showIf: function (c) { return c.mode === "bot"; },
        note: function (c) { return c.difficulty === "hard" ? "Hard bots think a move ahead and read your habits." : c.difficulty === "easy" ? "Easy bots make mistakes. Good for learning." : "A fair fight."; } }
    ],
    onStart: start,
    onRestart: restart,
    onQuit: quit,
    menuNote: function () { return G.state ? "Round " + G.state.round + " of " + L.CFG.roundLimit + "." : ""; }
  });
  (function crewOnTitle() {
    var inner = K.$(".title-inner .title-tag");
    if (!inner) return;
    var row = h("div", { class: "title-crew" });
    CREW.forEach(function (c, k) { row.appendChild(h("figure", { html: face(k) + "<figcaption>" + crewName(k) + "</figcaption>" })); });
    inner.insertAdjacentElement("afterend", row);
  })();
})();

</script>
</body>
</html>
