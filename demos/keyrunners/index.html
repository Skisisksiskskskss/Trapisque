<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keyrunners</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* ---------- Shared game kit: layout shell, controls, overlays ----------
   Each game sets its own palette and fonts by overriding these tokens on :root. */
:root{
  --bg:#101318; --bg-2:#161a21; --surface:#1d222b; --surface-2:#262c37; --line:#343b48;
  --ink:#eef1f5; --muted:#a3abb8; --accent:#f2c14e; --accent-ink:#17130a;
  --good:#47d18c; --bad:#ff6b5e; --p1:#5aa2ff; --p2:#ff6b5e;
  --font-display:system-ui,sans-serif; --font-body:system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:16px; --radius-sm:10px;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
  color-scheme:dark;
}
[hidden]{display:none !important}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg);-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}

/* ---------- Title screen ---------- */
.title-screen{overflow-y:auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:20px 28px;align-items:center}
.title-inner{width:100%;max-width:460px;display:flex;flex-direction:column;gap:20px;margin:auto 0}
.title-art{display:flex;justify-content:center}
.title-art svg{width:min(70vw,260px);height:auto}
.title-name{font-family:var(--font-display);font-size:clamp(2.3rem,9vw,3.3rem);line-height:.98;margin:0;text-align:center;letter-spacing:-.01em}
.title-tag{color:var(--muted);text-align:center;margin:0;font-size:1.02rem}
.opt-group{display:flex;flex-direction:column;gap:7px}
.opt-label{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--bg-2);border:1px solid var(--line);border-radius:14px}
.seg button{border:0;background:transparent;border-radius:10px;padding:10px 6px;min-height:44px;font-weight:650;font-size:.95rem;color:var(--muted);line-height:1.15}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 2px 8px rgba(0,0,0,.25)}
.opt-note{font-size:.86rem;color:var(--muted);margin:0}
.title-actions{display:flex;flex-direction:column;gap:10px;margin-top:4px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:1rem;line-height:1.1;transition:transform .08s, background .15s, border-color .15s, opacity .15s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent}
.btn-danger{background:var(--bad);border-color:var(--bad);color:#160807}
.btn-sm{min-height:38px;padding:7px 14px;font-size:.9rem}
.btn-wide{width:100%}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;flex:none}
.icon-btn svg{width:22px;height:22px}

/* ---------- Game screen frame ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:10px var(--gutter-r) 8px var(--gutter-l);min-height:60px}
.topbar .status{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.topbar .status-main{font-family:var(--font-display);font-size:1.15rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .status-sub{font-size:.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:4px var(--gutter-r) 4px var(--gutter-l)}
.stage > svg, .stage > .board{max-width:100%;max-height:100%}
.actionbar{padding:8px var(--gutter-r) 12px var(--gutter-l);display:flex;flex-direction:column;gap:8px}
.action-row{display:flex;gap:8px;align-items:stretch}
.action-row > *{flex:1}
.hint-line{font-size:.9rem;color:var(--muted);text-align:center;min-height:1.3em;margin:0}

/* ---------- Overlays ---------- */
.cover{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  padding:24px var(--gutter-r) 24px var(--gutter-l);background:var(--bg);animation:kit-fade .18s ease-out}
.cover .cover-badge{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:2px solid var(--line)}
.cover .cover-badge svg{width:42px;height:42px}
.cover h2{font-family:var(--font-display);font-size:clamp(1.9rem,8vw,2.6rem);margin:0;line-height:1.05}
.cover p{margin:0;color:var(--muted);max-width:32ch}
.cover .btn{margin-top:10px;min-width:220px}
.modal-wrap{position:absolute;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,6,10,.62);animation:kit-fade .15s ease-out}
@media (min-width:640px){ .modal-wrap{align-items:center} }
.modal{width:100%;max-width:560px;max-height:88%;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.4);animation:kit-rise .2s ease-out}
@media (min-width:640px){ .modal{border-radius:22px} }
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 18px 8px}
.modal-head h2{flex:1;margin:0;font-family:var(--font-display);font-size:1.45rem;line-height:1.1}
.modal-body{padding:6px 18px 12px;overflow-y:auto;min-height:0;user-select:text;-webkit-user-select:text}
.modal-actions{display:flex;flex-direction:column;gap:8px;padding:10px 18px calc(16px + env(safe-area-inset-bottom, 0px))}
.banner{position:absolute;left:0;right:0;top:38%;z-index:45;display:flex;flex-direction:column;align-items:center;pointer-events:none;text-align:center;padding:0 var(--gutter-r) 0 var(--gutter-l)}
.banner-text{font-family:var(--font-display);font-size:clamp(2.6rem,13vw,4.6rem);line-height:1;padding:10px 22px;border-radius:18px;color:var(--ink);text-shadow:0 4px 24px rgba(0,0,0,.55);animation:kit-pop .9s cubic-bezier(.2,.9,.3,1.3) both}
.banner-sub{margin-top:8px;font-weight:700;color:var(--ink);background:rgba(0,0,0,.55);padding:6px 12px;border-radius:999px;animation:kit-fade .3s .15s both}
.banner.tone-good .banner-text{color:var(--good)}
.banner.tone-bad .banner-text{color:var(--bad)}
.banner.tone-accent .banner-text{color:var(--accent)}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:46;max-width:calc(100% - 32px);padding:9px 16px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:650;font-size:.94rem;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:kit-drop .2s ease-out;text-align:center}
.shake{animation:kit-shake .38s linear}
@keyframes kit-fade{from{opacity:0}to{opacity:1}}
@keyframes kit-rise{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes kit-drop{from{transform:translate(-50%,-10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes kit-pop{0%{transform:scale(.4);opacity:0}25%{transform:scale(1.08);opacity:1}75%{transform:scale(1);opacity:1}100%{transform:scale(1.02);opacity:0}}
@keyframes kit-shake{0%,100%{transform:none}20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,2px)}}
@media (prefers-reduced-motion: reduce){
  .banner-text{animation-duration:.01s}
  .shake{animation:none}
}

/* ---------- Rules text ---------- */
.rules h3{font-family:var(--font-display);font-size:1.15rem;margin:16px 0 6px}
.rules h3:first-child{margin-top:4px}
.rules p{margin:0 0 8px;color:var(--ink)}
.rules ul,.rules ol{margin:0 0 10px;padding-left:1.2em;display:flex;flex-direction:column;gap:5px}
.rules li::marker{color:var(--muted)}
.rules .tip{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:.92rem}
.rules b{color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0 0 10px;align-items:start}
.kv dt{font-weight:750;white-space:nowrap}
.kv dd{margin:0;color:var(--muted)}
.result-stats{display:grid;grid-template-columns:1fr auto;gap:6px 16px;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.result-stats span:nth-child(even){font-weight:750;text-align:right}

/* Keyrunners: a night heist. Blue crew against red crew on a lit vault floor; gold keys and safes.
   One deliberate dark look, so every color is set here and color-scheme stays dark. */
:root{
  --bg:#0d1016; --bg-2:#131821; --surface:#19202a; --surface-2:#222b37; --line:#2d3746;
  --ink:#eef2f7; --muted:#97a3b6; --accent:#f2b840; --accent-ink:#1b1305;
  --good:#46d483; --bad:#ff6457;
  --blue:#3d8bff; --blue-2:#9cc3ff; --red:#ff5a4c; --red-2:#ffb0a6; --gold:#f2b840; --gold-2:#ffe2a0; --violet:#b48cff;
  --tile-a:#161d27; --tile-b:#1a222e; --grid:rgba(160,180,210,.07);
  --font-display:"Bebas Neue","Oswald","Arial Narrow",Impact,sans-serif;
  --font-body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink)}
.title-name{font-weight:400;letter-spacing:.04em;font-size:clamp(3rem,15vw,4.4rem)}
.title-name .k{color:var(--gold)}
.title-tag{max-width:34ch;margin-inline:auto}
.btn-primary{background:var(--gold);border-color:var(--gold);color:var(--accent-ink)}
.topbar .status-main{font-size:1.4rem;letter-spacing:.03em}
.cover h2{letter-spacing:.03em}
.cover.s0 h2{color:var(--blue)} .cover.s1 h2{color:var(--red)}
.cover-kicker{margin:0;font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.banner-text{letter-spacing:.04em}
.banner.tone-blue .banner-text{color:var(--blue)} .banner.tone-red .banner-text{color:var(--red)}

/* ---------- Top bar chips ---------- */
.foe{display:flex;align-items:center;gap:7px;padding:5px 10px 5px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);flex:none;font-variant-numeric:tabular-nums}
.foe .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.foe .dot svg{width:16px;height:16px}
.foe .dot.s0{background:var(--blue)} .foe .dot.s1{background:var(--red)}
.foe b{font-size:.95rem}
.foe small{color:var(--muted);font-size:.74rem;font-weight:700}

/* ---------- Board ---------- */
#board{width:100%;height:100%;display:block;touch-action:manipulation}
.tl-a{fill:var(--tile-a)} .tl-b{fill:var(--tile-b)}
.home0{fill:rgba(61,139,255,.09)} .home1{fill:rgba(255,90,76,.09)}
.gridl{stroke:var(--grid);stroke-width:1}
.zone{fill:none;stroke-width:1.6;stroke-dasharray:4 4;opacity:.55}
.zone.s0{stroke:var(--blue)} .zone.s1{stroke:var(--red)}
.safe-box{stroke-width:2.2}
.safe-box.s0{fill:rgba(61,139,255,.16);stroke:var(--blue)} .safe-box.s1{fill:rgba(255,90,76,.16);stroke:var(--red)}
.safe-dial{fill:none;stroke:var(--gold);stroke-width:2.2}
.safe-tick{stroke:var(--gold);stroke-width:2;stroke-linecap:round}
.row-label{font:700 9px var(--font-body);fill:var(--muted);opacity:.7;letter-spacing:.08em}
.smoke{fill:rgba(190,200,215,.20);stroke:rgba(220,228,240,.35);stroke-width:1.2;stroke-dasharray:3 3}
.trap{fill:none;stroke:var(--violet);stroke-width:2;stroke-linecap:round;opacity:.8}
.trail{fill:none;stroke-width:2;stroke-linecap:round;stroke-dasharray:3 4;opacity:.55}
.trail.s0{stroke:var(--blue-2)} .trail.s1{stroke:var(--red-2)}

/* highlights */
.hl-move{fill:rgba(238,242,247,.30)}
.hl-cap{fill:none;stroke:var(--bad);stroke-width:2.6}
.hl-ab{fill:rgba(242,184,64,.12);stroke:var(--gold);stroke-width:2}
.hl-pass{fill:none;stroke:var(--gold);stroke-width:2.4;stroke-dasharray:5 3}
.hl-deploy.s0{fill:rgba(61,139,255,.22);stroke:rgba(61,139,255,.6);stroke-width:1.2}
.hl-deploy.s1{fill:rgba(255,90,76,.22);stroke:rgba(255,90,76,.6);stroke-width:1.2}
.hl-throw-ok{fill:var(--good)} .hl-throw-bad{fill:var(--bad)} .hl-throw-ground{fill:var(--muted)}
.hl-reach{fill:rgba(255,100,87,.13);stroke:rgba(255,100,87,.45);stroke-width:1}
.hl-area{fill:rgba(242,184,64,.18);stroke:var(--gold);stroke-width:1.6;stroke-dasharray:4 3}
.hl-pick{fill:none;stroke:var(--gold);stroke-width:2.2}
.hl-dim{fill:rgba(242,184,64,.07)}
.path-prev{fill:none;stroke:var(--gold);stroke-width:2.2;stroke-dasharray:4 4;stroke-linecap:round}

/* units */
.tok{transition:transform .34s cubic-bezier(.3,.7,.3,1), opacity .3s}
.tok-body.s0{fill:var(--blue)} .tok-body.s1{fill:var(--red)}
.tok-lead{fill:none;stroke:rgba(255,255,255,.85);stroke-width:1.6;stroke-dasharray:3 2.2}
.tok-carry{fill:rgba(242,184,64,.16);stroke:var(--gold);stroke-width:3;opacity:0}
.tok.carrier .tok-carry{opacity:1}
.tok-icon{fill:none;stroke:#fff;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.tok-ring{fill:none;stroke:var(--ink);stroke-width:2.4;opacity:0}
.tok.sel .tok-ring{opacity:1}
.tok.ready .tok-ready{opacity:1}
.tok-ready{fill:none;stroke:rgba(255,255,255,.55);stroke-width:1.4;stroke-dasharray:2.5 3;opacity:0}
.tok.spent .tok-body{opacity:.72}
.tok.fresh .tok-body{opacity:.6}
.tok.dying{opacity:0;transition:opacity .35s}
.tok-key{display:none}
.tok.k0 .tok-key.k0,.tok.k1 .tok-key.k1{display:inline}
.key-bow{stroke:var(--accent-ink);stroke-width:1.2}
.key-bow.k0{fill:var(--blue-2)} .key-bow.k1{fill:var(--red-2)}
.key-shaft{fill:var(--gold);stroke:var(--accent-ink);stroke-width:1}
.tok-stun,.tok-brace,.tok-glitch,.tok-armor,.tok-danger,.tok-fresh{display:none}
.tok.stunned .tok-stun,.tok.braced .tok-brace,.tok.glitched .tok-glitch,.tok.armored .tok-armor,.tok.danger .tok-danger,.tok.fresh .tok-fresh{display:inline}
.tok-stun path{fill:none;stroke:var(--gold-2);stroke-width:1.8;stroke-linecap:round}
.tok-brace{fill:none;stroke:var(--gold);stroke-width:2;stroke-dasharray:3 2}
.tok-glitch{fill:none;stroke:var(--violet);stroke-width:2.2;stroke-dasharray:1.5 2.5}
.tok-armor{fill:#c9d2de;stroke:#56606e;stroke-width:1}
.tok-danger circle{fill:var(--bad);stroke:var(--bg);stroke-width:1.5}
.tok-danger text{fill:#fff;font:800 11px var(--font-body)}
.tok-fresh{fill:var(--bg);stroke:var(--muted);stroke-width:1}
.tok-fresh text{fill:var(--ink);font:800 8px var(--font-body)}
.gkey{pointer-events:none}
.hit-layer rect{fill:transparent;cursor:pointer}
@keyframes kr-pulse{0%,100%{opacity:.35}50%{opacity:1}}
.pulse{animation:kr-pulse 1.1s ease-in-out infinite}

/* effects */
.fx-hit{fill:rgba(255,120,90,.45);stroke:var(--bad);stroke-width:2}
.fx-shot{stroke:var(--gold-2);stroke-width:2.4;stroke-linecap:round}
.fx-ring{fill:none;stroke:var(--blue-2);stroke-width:3}
.fx-ring.alarm{stroke:var(--gold)}
.fx-text{font:800 12px var(--font-body);text-anchor:middle}

/* ---------- Action bar ---------- */
#screen-game .actionbar{gap:6px;padding-top:4px;flex:none}
.say{font-size:.86rem;text-align:center;margin:0;color:var(--muted);height:2.5em;line-height:1.25;overflow:hidden;display:flex;align-items:center;justify-content:center}
.say b{color:var(--ink)}
.say.warn{color:var(--bad);font-weight:700}
.say.good{color:var(--good);font-weight:700}
.ctx{height:126px;display:flex;flex-direction:column;gap:6px}
.ctx > .info{flex:1;min-height:0}
.ctx .note{margin:0;font-size:.78rem;color:var(--muted);text-align:center}
.info{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:7px 10px;min-height:0;width:100%;text-align:left;font:inherit;color:inherit;position:relative;overflow:hidden}
button.info{cursor:pointer}
.info .more{position:absolute;top:6px;right:8px;width:17px;height:17px;border-radius:50%;border:1.5px solid var(--muted);color:var(--muted);font:800 .66rem/14px var(--font-body);text-align:center}
.info .txt .dim{color:var(--muted);opacity:.8;font-size:.74rem}
.info .badge{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center}
.info .badge.s0{background:var(--blue)} .info .badge.s1{background:var(--red)} .info .badge.g{background:var(--surface-2);border:1.5px solid var(--gold)}
.info .badge svg{width:22px;height:22px}
.info .txt{flex:1;min-width:0;font-size:.78rem;line-height:1.28;color:var(--muted);padding-right:14px}
.info .txt b{color:var(--ink);font-size:.88rem}
.info .txt .nm{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;margin-bottom:1px}
.info .txt .tag{font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.info .txt .st{font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--bad)}
.info .txt p{margin:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.acts{display:flex;gap:6px;flex:none}
.acts .btn{min-height:36px;padding:5px 8px;font-size:.84rem;flex:1 1 0;min-width:0;white-space:nowrap}
.acts .btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.acts .btn .c{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:var(--accent-ink);font-size:.72rem;font-weight:800;padding:0 4px}
.hand{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 3px 6px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);min-height:66px;color:var(--ink)}
.card svg{width:22px;height:22px}
.card .nm{font-size:.7rem;font-weight:800;line-height:1.05;text-align:center}
.card .cost{position:absolute;top:-6px;right:-5px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:var(--accent-ink);font-size:.72rem;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
.card.gadget{border-style:dashed;border-color:rgba(242,184,64,.55)}
.card.poor{opacity:.5}
.card[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;background:var(--surface-2)}
.card.empty{border-style:dotted;opacity:.35;min-height:66px}
.next{font-size:.72rem;color:var(--muted);text-align:center;margin:-2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bottom{display:flex;gap:8px;align-items:center}
.mana{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.mana .lbl{font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.mana .lbl b{color:var(--gold);font-size:.82rem;letter-spacing:0;font-variant-numeric:tabular-nums}
.mana .lbl b.neg{color:var(--bad)}
.pips{display:flex;gap:3px}
.pip{flex:1;height:8px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.pip.on{background:var(--gold);border-color:var(--gold)}
.pip.debt{background:var(--bad);border-color:var(--bad)}
.bottom .btn{min-height:44px;padding:8px 14px}
#btn-undo{flex:none}
#btn-end{flex:none;min-width:116px}

/* ---------- Crew builder ---------- */
.deck-screen{overflow-y:auto;padding:12px var(--gutter-r) 0 var(--gutter-l)}
.deck-inner{width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-bottom:12px}
.deck-head h2{font-family:var(--font-display);font-weight:400;font-size:2.1rem;letter-spacing:.03em;margin:0;line-height:1}
.deck-head h2.s0{color:var(--blue)} .deck-head h2.s1{color:var(--red)}
.deck-head p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets .btn{min-height:36px;padding:6px 12px;font-size:.84rem}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 6px}
.sec-h span{font-size:.74rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sec-h b{font-size:.82rem;color:var(--gold);font-variant-numeric:tabular-nums}
.pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pick.lead{grid-template-columns:repeat(3,minmax(0,1fr))}
.pick.gad{grid-template-columns:repeat(3,minmax(0,1fr))}
.pick .card{min-height:72px}
.pick .card .tick{position:absolute;top:5px;left:6px;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line)}
.pick .card[aria-pressed="true"] .tick{background:var(--gold);border-color:var(--gold)}
.detail{position:sticky;bottom:0;background:linear-gradient(to bottom, rgba(13,16,22,0), var(--bg) 14px);padding:14px 0 calc(12px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:8px}
.detail .info{min-height:74px}
.detail .row{display:flex;gap:8px}
.detail .row .btn{flex:1}

/* ---------- Rules ---------- */
.rules .glossary{display:flex;flex-direction:column;gap:8px;margin:6px 0 10px}
.rules .gl{display:flex;gap:10px;align-items:flex-start}
.rules .gl .badge{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line)}
.rules .gl .badge svg{width:18px;height:18px}
.rules .gl p{margin:0;font-size:.88rem;color:var(--muted)}
.rules .gl p b{color:var(--ink)}
.rules .gl .cost{display:inline-grid;place-items:center;min-width:17px;height:17px;border-radius:9px;background:var(--gold);color:var(--accent-ink);font-size:.7rem;font-weight:800;margin-left:4px;padding:0 4px}
@media (max-height:740px){
  .topbar{min-height:50px;padding-top:6px;padding-bottom:4px}
  .say{height:2.4em;font-size:.76rem;line-height:1.2}
  .ctx{height:104px}
  .info .txt{font-size:.72rem;line-height:1.22}
  .info .txt .dim{display:none}
  .info .badge{width:28px;height:28px}
  .info .badge svg{width:18px;height:18px}
  .card{min-height:52px;padding:5px 3px 4px}
  .card svg{width:18px;height:18px}
  .next{display:none}
  .bottom .btn{min-height:40px}
}
@media (prefers-reduced-motion: reduce){ .tok{transition:none} .pulse{animation:none} }

<body>
<div id="app" class="app">
  <section id="screen-title" class="screen title-screen"></section>
  <section id="screen-deck" class="screen deck-screen" hidden></section>
  <section id="screen-game" class="screen" hidden>
    <header class="topbar">
      <button id="btn-menu" class="icon-btn" type="button" aria-label="Menu"></button>
      <div class="status"><div class="status-main" id="st-main">Your turn</div><div class="status-sub" id="st-sub"></div></div>
      <div id="foe"></div>
    </header>
    <div class="stage" id="stage"></div>
    <div class="actionbar" id="actionbar"></div>
  </section>
</div>
<script>
/* Shared game kit: title screen, menus, pass-the-phone covers, banners, sound.
   Exposes window.Kit. No game logic lives here. */
(function (root) {
  "use strict";
  var doc = root.document;
  var NS = "game";
  var reduceMotion = false;
  try { reduceMotion = root.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}

  function $(sel, scope) { return (scope || doc).querySelector(sel); }
  function $all(sel, scope) { return Array.prototype.slice.call((scope || doc).querySelectorAll(sel)); }

  function h(tag, attrs) {
    var node = doc.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
        var v = attrs[k];
        if (v == null || v === false) continue;
        if (k === "class") node.className = v;
        else if (k === "html") node.innerHTML = v;
        else if (k === "text") node.textContent = v;
        else if (k.slice(0, 2) === "on" && typeof v === "function") node.addEventListener(k.slice(2), v);
        else node.setAttribute(k, v === true ? "" : v);
      }
    }
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      if (Array.isArray(c)) c.forEach(function (x) { if (x != null) node.appendChild(typeof x === "string" ? doc.createTextNode(x) : x); });
      else node.appendChild(typeof c === "string" ? doc.createTextNode(c) : c);
    }
    return node;
  }

  var SVGNS = "http://www.w3.org/2000/svg";
  function s(tag, attrs) {
    var node = doc.createElementNS(SVGNS, tag);
    if (attrs) {
      for (var k in attrs) {
        if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
        var v = attrs[k];
        if (v == null || v === false) continue;
        if (k === "text") node.textContent = v;
        else if (k.slice(0, 2) === "on" && typeof v === "function") node.addEventListener(k.slice(2), v);
        else node.setAttribute(k, v);
      }
    }
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      if (Array.isArray(c)) c.forEach(function (x) { if (x) node.appendChild(x); });
      else node.appendChild(c);
    }
    return node;
  }

  var store = {
    get: function (k, d) {
      try { var v = root.localStorage.getItem(NS + ":" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; }
    },
    set: function (k, v) { try { root.localStorage.setItem(NS + ":" + k, JSON.stringify(v)); } catch (e) {} }
  };

  var speed = 1;
  function sleep(ms) {
    var t = reduceMotion ? Math.min(ms, 80) : ms * speed;
    return new Promise(function (r) { setTimeout(r, t); });
  }
  function frame() { return new Promise(function (r) { root.requestAnimationFrame(function () { r(); }); }); }

  /* ---------- Sound: tiny WebAudio synth, starts after the first tap ---------- */
  var Sound = (function () {
    var ctx = null, master = null, on = true;
    function ensure() {
      if (ctx) { if (ctx.state === "suspended") ctx.resume(); return ctx; }
      var AC = root.AudioContext || root.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.55;
      master.connect(ctx.destination);
      return ctx;
    }
    function tone(freq, dur, opts) {
      opts = opts || {};
      var c = ensure(); if (!c) return;
      var t0 = c.currentTime + (opts.delay || 0);
      var o = c.createOscillator();
      var g = c.createGain();
      o.type = opts.type || "sine";
      o.frequency.setValueAtTime(freq, t0);
      if (opts.to) o.frequency.exponentialRampToValueAtTime(Math.max(20, opts.to), t0 + dur);
      var peak = opts.gain == null ? 0.25 : opts.gain;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + Math.min(0.02, dur / 4));
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(master);
      o.start(t0); o.stop(t0 + dur + 0.05);
    }
    function noise(dur, opts) {
      opts = opts || {};
      var c = ensure(); if (!c) return;
      var t0 = c.currentTime + (opts.delay || 0);
      var len = Math.max(1, Math.floor(c.sampleRate * dur));
      var buf = c.createBuffer(1, len, c.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = c.createBufferSource();
      src.buffer = buf;
      var f = c.createBiquadFilter();
      f.type = opts.filter || "lowpass";
      f.frequency.value = opts.freq || 1200;
      var g = c.createGain();
      g.gain.setValueAtTime(opts.gain == null ? 0.3 : opts.gain, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t0); src.stop(t0 + dur + 0.05);
    }
    var lib = {
      tap: function () { tone(660, 0.06, { type: "triangle", gain: 0.12 }); },
      select: function () { tone(520, 0.07, { type: "triangle", gain: 0.16 }); tone(780, 0.08, { type: "triangle", gain: 0.12, delay: 0.05 }); },
      move: function () { tone(300, 0.12, { type: "sine", to: 420, gain: 0.16 }); },
      slide: function () { noise(0.16, { freq: 900, gain: 0.12 }); },
      error: function () { tone(180, 0.16, { type: "square", gain: 0.08 }); },
      hit: function () { noise(0.22, { freq: 700, gain: 0.45 }); tone(140, 0.25, { type: "sawtooth", to: 60, gain: 0.22 }); },
      miss: function () { noise(0.3, { freq: 2400, filter: "bandpass", gain: 0.22 }); },
      splash: function () { noise(0.45, { freq: 1600, gain: 0.35 }); tone(220, 0.3, { to: 90, gain: 0.08 }); },
      ping: function () { tone(1320, 0.5, { type: "sine", gain: 0.2 }); tone(1320, 0.6, { type: "sine", gain: 0.07, delay: 0.32 }); },
      contact: function () { tone(880, 0.16, { type: "square", gain: 0.1 }); tone(880, 0.16, { type: "square", gain: 0.1, delay: 0.2 }); tone(1175, 0.3, { type: "square", gain: 0.1, delay: 0.4 }); },
      reveal: function () { tone(392, 0.12, { type: "triangle", gain: 0.16 }); tone(587, 0.18, { type: "triangle", gain: 0.16, delay: 0.1 }); },
      roar: function () { tone(110, 0.7, { type: "sawtooth", to: 55, gain: 0.25 }); noise(0.6, { freq: 400, gain: 0.25 }); },
      liar: function () { tone(220, 0.12, { type: "square", gain: 0.14 }); tone(165, 0.35, { type: "square", gain: 0.14, delay: 0.12 }); },
      win: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.22, { type: "triangle", gain: 0.16, delay: i * 0.11 }); }); },
      lose: function () { [392, 330, 262, 196].forEach(function (f, i) { tone(f, 0.28, { type: "triangle", gain: 0.14, delay: i * 0.14 }); }); },
      tick: function () { tone(1000, 0.03, { type: "square", gain: 0.05 }); },
      whoosh: function () { noise(0.25, { freq: 3000, filter: "bandpass", gain: 0.18 }); },
      score: function () { tone(880, 0.09, { type: "triangle", gain: 0.14 }); tone(1320, 0.14, { type: "triangle", gain: 0.12, delay: 0.07 }); },
      zap: function () { tone(1400, 0.18, { type: "sawtooth", to: 300, gain: 0.1 }); }
    };
    return {
      play: function (name) { if (!on) return; try { var f = lib[name]; if (f) f(); } catch (e) {} },
      unlock: function () { if (on) { try { ensure(); } catch (e) {} } },
      get on() { return on; },
      set on(v) { on = !!v; store.set("sound", on); }
    };
  })();

  function haptic(ms) { try { if (root.navigator.vibrate) root.navigator.vibrate(ms || 12); } catch (e) {} }

  /* ---------- Overlays ---------- */
  var app = null;
  function appRoot() { return app || (app = $("#app")); }

  function cover(opts) {
    opts = opts || {};
    return new Promise(function (resolve) {
      var btn = h("button", { class: "btn btn-primary", type: "button" }, opts.cta || "Tap when ready");
      var node = h("div", { class: "cover" + (opts.className ? " " + opts.className : ""), role: "dialog", "aria-modal": "true" },
        opts.badge ? h("div", { class: "cover-badge", html: opts.badge }) : null,
        opts.kicker ? h("p", { class: "cover-kicker" }, opts.kicker) : null,
        h("h2", null, opts.title || "Pass the phone"),
        opts.text ? h("p", null, opts.text) : null,
        btn);
      btn.addEventListener("click", function () { Sound.unlock(); Sound.play("tap"); node.remove(); resolve(); });
      appRoot().appendChild(node);
      setTimeout(function () { try { btn.focus(); } catch (e) {} }, 30);
    });
  }

  function modal(opts) {
    opts = opts || {};
    return new Promise(function (resolve) {
      var wrap;
      function done(v) { wrap.remove(); doc.removeEventListener("keydown", onKey); resolve(v); }
      function onKey(e) { if (e.key === "Escape" && opts.dismissible !== false) done(null); }
      var body = h("div", { class: "modal-body" + (opts.bodyClass ? " " + opts.bodyClass : "") });
      if (typeof opts.body === "string") body.innerHTML = opts.body; else if (opts.body) body.appendChild(opts.body);
      var actions = h("div", { class: "modal-actions" });
      (opts.actions || [{ label: "Close", value: null }]).forEach(function (a) {
        actions.appendChild(h("button", {
          class: "btn btn-wide " + (a.kind === "primary" ? "btn-primary" : a.kind === "danger" ? "btn-danger" : "btn-ghost"),
          type: "button",
          onclick: function () { Sound.play("tap"); done(a.value); }
        }, a.label));
      });
      var closeBtn = opts.dismissible === false ? null : h("button", { class: "icon-btn", type: "button", "aria-label": "Close", onclick: function () { done(null); },
        html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>' });
      var panel = h("div", { class: "modal", role: "dialog", "aria-modal": "true", "aria-label": opts.title || "Dialog" },
        h("div", { class: "modal-head" }, h("h2", null, opts.title || ""), closeBtn),
        body,
        (opts.actions && opts.actions.length === 0) ? null : actions);
      wrap = h("div", { class: "modal-wrap", onclick: function (e) { if (e.target === wrap && opts.dismissible !== false) done(null); } }, panel);
      appRoot().appendChild(wrap);
      doc.addEventListener("keydown", onKey);
    });
  }

  function banner(text, opts) {
    opts = opts || {};
    var node = h("div", { class: "banner tone-" + (opts.tone || "accent"), "aria-live": "assertive" },
      h("div", { class: "banner-text" }, text),
      opts.sub ? h("div", { class: "banner-sub" }, opts.sub) : null);
    appRoot().appendChild(node);
    var ms = opts.ms || 1100;
    return sleep(ms).then(function () { node.remove(); });
  }

  var toastTimer = null, toastNode = null;
  function toast(text, ms) {
    if (toastNode) toastNode.remove();
    toastNode = h("div", { class: "toast", role: "status" }, text);
    appRoot().appendChild(toastNode);
    clearTimeout(toastTimer);
    var n = toastNode;
    toastTimer = setTimeout(function () { if (n) n.remove(); if (toastNode === n) toastNode = null; }, ms || 1900);
  }

  function shake(node) {
    if (!node || reduceMotion) return;
    node.classList.remove("shake");
    void node.getBoundingClientRect();
    node.classList.add("shake");
    setTimeout(function () { node.classList.remove("shake"); }, 420);
  }

  /* ---------- Title screen with option pickers ---------- */
  var ICONS = {
    menu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
    soundOn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>',
    soundOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>',
    phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>',
    eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    help: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.3a2.6 2.6 0 015 1c0 1.8-2.5 2.2-2.5 3.9M12 17.2v.3"/></svg>'
  };

  var cfg = null;
  var choice = {};

  function visibleOptions() {
    return cfg.options.filter(function (o) { return !o.showIf || o.showIf(choice); });
  }

  function renderTitle() {
    var host = $("#title-options");
    host.innerHTML = "";
    visibleOptions().forEach(function (opt) {
      var seg = h("div", { class: "seg", role: "group", "aria-label": opt.label });
      opt.choices.forEach(function (c) {
        seg.appendChild(h("button", {
          type: "button",
          "aria-pressed": choice[opt.id] === c.v ? "true" : "false",
          onclick: function () {
            Sound.unlock(); Sound.play("tap");
            choice[opt.id] = c.v;
            store.set("choice", choice);
            renderTitle();
          }
        }, c.t));
      });
      var note = opt.note ? opt.note(choice) : null;
      host.appendChild(h("div", { class: "opt-group" },
        h("span", { class: "opt-label" }, opt.label), seg,
        note ? h("p", { class: "opt-note" }, note) : null));
    });
  }

  function showRules() {
    return modal({ title: "How to play", body: cfg.rules, bodyClass: "rules", actions: [{ label: "Got it", value: true, kind: "primary" }] });
  }

  function showScreen(name) {
    $all(".screen").forEach(function (sc) { sc.hidden = sc.id !== "screen-" + name; });
  }

  function init(config) {
    cfg = config;
    NS = config.ns || NS;
    Sound.on = store.get("sound", true);
    var saved = store.get("choice", {});
    choice = {};
    cfg.options.forEach(function (o) {
      var ok = o.choices.some(function (c) { return c.v === saved[o.id]; });
      choice[o.id] = ok ? saved[o.id] : o.default;
    });
    var title = $("#screen-title");
    title.innerHTML = "";
    title.appendChild(h("div", { class: "title-inner" },
      cfg.art ? h("div", { class: "title-art", html: cfg.art }) : null,
      h("h1", { class: "title-name" }, cfg.title),
      h("p", { class: "title-tag" }, cfg.tagline),
      h("div", { id: "title-options", class: "title-options", style: "display:flex;flex-direction:column;gap:14px" }),
      h("div", { class: "title-actions" },
        h("button", { class: "btn btn-primary btn-wide", type: "button", id: "btn-start", onclick: function () {
          Sound.unlock(); Sound.play("select");
          var c = {}; visibleOptions().forEach(function (o) { c[o.id] = choice[o.id]; });
          cfg.onStart(c);
        } }, "Play"),
        h("button", { class: "btn btn-ghost btn-wide", type: "button", onclick: function () { Sound.unlock(); Sound.play("tap"); showRules(); } }, "How to play"))));
    renderTitle();
    showScreen("title");
    var menuBtn = $("#btn-menu");
    if (menuBtn) {
      menuBtn.innerHTML = ICONS.menu;
      menuBtn.onclick = function () { Sound.play("tap"); openMenu(); };
    }
  }

  function openMenu() {
    return modal({
      title: "Paused",
      body: h("p", { style: "margin:0;color:var(--muted)" }, cfg.menuNote ? cfg.menuNote() : "The game is waiting for you."),
      actions: [
        { label: "Resume", value: "resume", kind: "primary" },
        { label: "How to play", value: "rules" },
        { label: Sound.on ? "Sound: on" : "Sound: off", value: "sound" },
        { label: "Restart this match", value: "restart" },
        { label: "Quit to title", value: "quit", kind: "danger" }
      ]
    }).then(function (v) {
      if (v === "rules") return showRules().then(openMenu);
      if (v === "sound") { Sound.on = !Sound.on; if (Sound.on) Sound.play("select"); return openMenu(); }
      if (v === "restart") return confirmAsk("Restart this match?", "The current match will be lost.").then(function (ok) { if (ok && cfg.onRestart) cfg.onRestart(); });
      if (v === "quit") return confirmAsk("Quit to the title screen?", "The current match will be lost.").then(function (ok) { if (ok) quit(); });
    });
  }

  function confirmAsk(title, text) {
    return modal({ title: title, body: h("p", { style: "margin:0;color:var(--muted)" }, text), actions: [
      { label: "Yes", value: true, kind: "danger" }, { label: "Cancel", value: false }] }).then(function (v) { return v === true; });
  }

  function quit() {
    if (cfg.onQuit) cfg.onQuit();
    $all(".cover,.modal-wrap,.banner,.toast").forEach(function (n) { n.remove(); });
    renderTitle();
    showScreen("title");
  }

  function gameOver(opts) {
    Sound.play(opts.tone === "bad" ? "lose" : "win");
    var body = h("div", null,
      opts.text ? h("p", { style: "margin:0 0 10px;color:var(--muted)" }, opts.text) : null,
      opts.stats ? (function () {
        var grid = h("div", { class: "result-stats" });
        opts.stats.forEach(function (row) { grid.appendChild(h("span", null, row[0])); grid.appendChild(h("span", null, String(row[1]))); });
        return grid;
      })() : null);
    return modal({ title: opts.title, body: body, dismissible: false, actions: [
      { label: "Rematch", value: "rematch", kind: "primary" },
      { label: opts.reviewLabel || "Look at the board", value: "review" },
      { label: "Main menu", value: "menu" }] }).then(function (v) {
        if (v === "menu") { quit(); return "menu"; }
        return v;
      });
  }

  /* Small seeded RNG so bots can be varied but testable. */
  function rng(seed) {
    var a = (seed >>> 0) || 0x9e3779b9;

    if (act) {
      if (act.hook != null) { G.hookUnit = act.hook; K.Sound.play("tap"); render(); return; }
      if (act.area != null) { G.areaPick = act.area; K.Sound.play("tap"); render(); return; }
      doHuman(act);
      return;
    }
    if (u && u.side === st.side) { if (G.sel === u.id) { clearSel(); render(); } else selectUnit(u.id); return; }
    if (u) { clearSel(); G.inspect = u.id; K.Sound.play("tap"); render(); return; }
    if (G.sel >= 0 || G.card >= 0 || G.inspect >= 0) { clearSel(); render(); }
  }

  async function doHuman(a) {
    if (!isHumanTurn()) return;
    if (!KR.isLegal(G.st, a)) { K.Sound.play("error"); K.toast("That move isn't allowed right now."); return; }
    G.busy = true;
    G.undo.push({ st: KR.cloneState(G.st), say: G.say });
    if (G.undo.length > 40) G.undo.shift();
    G.trails = [];
    G.st.revealed = false; G.st.drew = false;
    var keepSel = a.t === "move" || a.t === "ab" || a.t === "pass" || a.t === "throw" ? a.u : -1;
    clearSel();
    await perform(a, G.token);
    if (G.st.revealed || G.st.drew) G.undo = [];
    G.busy = false;
    if (keepSel >= 0) {
      var u = KR.unit(G.st, keepSel);
      if (u && u.side === G.st.side && canDoAnything(G.st, u)) { G.sel = keepSel; G.mode = KR.canMove(G.st, u) && KR.moveTargets(G.st, u).length ? "move" : null; }
    }
    render();
  }

  function doUndo() {
    if (!isHumanTurn() || !G.undo.length) return;
    var snap = G.undo.pop();
    G.st = snap.st;
    G.say = snap.say || "";
    G.sayCls = "";
    clearSel();
    K.Sound.play("slide");
    render();
  }

  function endTurnClicked() {
    if (!isHumanTurn()) return;
    var r = G.resolver;
    G.resolver = null;
    G.busy = true;
    clearSel();
    K.Sound.play("tap");
    r();
  }

  /* ---------- Performing actions, with words and effects ---------- */
  function describe(a, ev, before, side) {
    var st = G.st;
    function nm(id) { var u = KR.unit(st, id) || KR.unit(before, id); return u ? uName(u) : "a unit"; }
    var parts = [], cls = "";
    var hidden = G.cfg.mode !== "local" && side !== mySide();
    ev.forEach(function (e) {
      switch (e.e) {
        case "deploy": parts.push(sideWord(e.side) + " deploys a " + shortName(e.type) + "."); break;
        case "capture":
          var took = e.keys && e.keys.length;
          parts.push(nm(e.u) + " captures " + sideWord(e.side) + " " + shortName(e.type) + (took ? (e.keys[0] === side ? " and wins the key back!" : " and steals the key!") : "."));
          if (took) cls = e.keys[0] === mySide() && G.cfg.mode !== "local" ? "warn" : "good";
          break;
        case "bounce": parts.push(nm(e.o) + "'s armor stops " + nm(e.u) + "."); break;
        case "out": if (e.cause !== "capture") parts.push(sideWord(e.side) + " " + shortName(e.type) + " is taken out" + (e.cause === "trap" ? " by a tripwire!" : "!")); break;
        case "armor": parts.push(nm(e.u) + "'s armor takes the hit."); break;
        case "trap": parts.push("Tripwire!"); break;
        case "pass":
          if (e.how === "swipe") parts.push(nm(e.to) + " swipes the key from " + nm(e.from) + "!");
          else if (e.how === "call") parts.push(nm(e.to) + " calls for the key.");
          else parts.push(nm(e.from) + " passes the key to " + nm(e.to) + ".");
          break;
        case "throw":
          if (e.by < 0) parts.push("The key lands on the floor.");
          else { var c = KR.unit(st, e.by); parts.push(c && c.side !== side ? "Intercepted! " + nm(e.by) + " grabs the key." : nm(e.by) + " catches the key."); }
          break;
        case "pickup": parts.push(nm(e.u) + " picks up the key."); break;
        case "ability":
          var ab = T[(KR.unit(st, e.u) || KR.unit(before, e.u)).type].aname;
          var tgt = KR.unit(before, before.board[e.at]);
          if (e.ab === "brace") parts.push(nm(e.u) + " braces.");
          else if (e.ab === "glitch") parts.push(nm(e.u) + " glitches " + (tgt ? uName(tgt) : "a unit") + ".");
          else if (e.ab === "orders") parts.push(nm(e.u) + " orders " + (tgt ? uName(tgt) : "a unit") + " to move again.");
          else if (e.ab === "insideman") parts.push(nm(e.u) + ": deploy next to any crew this turn.");
          else if (e.ab === "switch" || e.ab === "vanish") parts.push(nm(e.u) + " swaps places with " + (tgt ? uName(tgt) : "a unit") + ".");
          else if (e.ab === "shove") parts.push(nm(e.u) + " shoves " + (tgt ? uName(tgt) : "a unit") + ".");
          else if (e.ab === "longshot") parts.push(nm(e.u) + " lines up a Long Shot.");
          else if (e.ab !== "call" && e.ab !== "swipe") parts.push(nm(e.u) + " uses " + ab + ".");
          break;
        case "stun": parts.push(nm(e.u) + " is stunned."); break;
        case "gadget":
          if (e.g === "tripwire") parts.push(hidden ? sideWord(e.side) + " hides a tripwire somewhere." : "You hide a tripwire. Only you can see it.");
          else if (e.g === "bribe") parts.push(sideWord(e.side) + " pays a Bribe.");
          else parts.push(sideWord(e.side) + " uses " + GD[e.g].name + ".");
          break;
        case "bribe": parts.push(nm(e.u) + " switches sides!"); break;
        case "burn": parts.push(sideWord(e.side) + " discards " + (hidden ? "a card" : (e.card.k === "crew" ? T[e.card.t].name : GD[e.card.t].name)) + "."); break;
        case "draw": if (e.side === side && !hidden) parts.push("New hand."); break;
      }
    });
    if (!parts.length && a.t === "move") parts.push(nm(a.u) + " moves.");
    return { html: parts.join(" "), cls: cls };
  }

  function addTrails(ev, side) {
    ev.forEach(function (e) { if (e.e === "move" && e.how !== "push") G.trails.push({ from: e.from, to: e.to, side: side }); });
  }

  function fxAt(node, ms) { G.layers.fx.appendChild(node); setTimeout(function () { node.remove(); }, ms || 600); return node; }
  function anim(node, frames, opts) { if (K.reduceMotion || !node.animate) return; try { node.animate(frames, opts); } catch (e) {} }

  function keyFlight(a, b, k, path) {
    var g = keyGlyph(k, 0, 0, 1.6, "gkey");
    var holder = sv("g");
    holder.appendChild(g);
    fxAt(holder, 520);
    var ax = cx(a), ay = cy(a), bx = cx(b), by = cy(b), mx = (ax + bx) / 2, my = (ay + by) / 2 - 22;
    holder.style.transform = "translate(" + bx + "px," + by + "px)";
    anim(holder, [{ transform: "translate(" + ax + "px," + ay + "px)" }, { transform: "translate(" + mx + "px," + my + "px)" }, { transform: "translate(" + bx + "px," + by + "px)" }], { duration: 460, easing: "ease-out" });
  }

  async function effects(ev, before, side) {
    var wait = 260;
    ev.forEach(function (e) {
      switch (e.e) {
        case "move": K.Sound.play(e.how === "push" ? "slide" : "move"); break;
        case "capture": case "out":
          var X = cx(e.at), Y = cy(e.at);
          var c = fxAt(sv("circle", { cx: X, cy: Y, r: 14, class: "fx-hit" }), 520);
          anim(c, [{ opacity: 1 }, { opacity: 0 }], { duration: 520 });
          K.Sound.play("hit"); K.haptic(20); K.shake(K.$("#stage"));
          wait = Math.max(wait, 420);
          break;
        case "bounce": case "armor": K.Sound.play("error"); break;
        case "pass": if (e.keys && e.keys.length) { keyFlight(e.a, e.b, e.keys[0]); K.Sound.play("whoosh"); wait = Math.max(wait, 480); } break;
        case "throw": if (e.keys && e.keys.length) { keyFlight(e.from, e.at, e.keys[0]); K.Sound.play("whoosh"); wait = Math.max(wait, 480); } break;
        case "pickup": K.Sound.play("score"); break;
        case "ability":
          if (e.ab === "longshot") {
            fxAt(sv("path", { d: "M" + cx(e.from) + " " + cy(e.from) + "L" + cx(e.at) + " " + cy(e.at), class: "fx-shot" }), 360);
            K.Sound.play("zap");
          } else if (e.ab === "glitch" || e.ab === "brace" || e.ab === "orders" || e.ab === "insideman") K.Sound.play("zap");
          break;
        case "stun":
          var st = sv("text", { x: cx(e.at), y: cy(e.at) - 26, class: "fx-text", fill: "#ffe2a0", text: "stunned" });
          fxAt(st, 900);
          anim(st, [{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(-10px)", opacity: 0 }], { duration: 900, fill: "forwards" });
          break;
        case "deploy":
          K.Sound.play("select");
          var n = G.nodes[e.u];
          if (n) anim(n, [{ opacity: 0 }, { opacity: 1 }], { duration: 300 });
          break;
        case "gadget":
          K.Sound.play(e.g === "emp" ? "zap" : e.g === "smoke" ? "splash" : e.g === "alarm" ? "contact" : "whoosh");
          if (e.g === "emp" || e.g === "alarm") {
            var at0 = e.g === "alarm" ? KR.SAFE[e.side] : e.at;
            var ring = fxAt(sv("circle", { cx: cx(at0), cy: cy(at0), r: 20, class: "fx-ring" + (e.g === "alarm" ? " alarm" : "") }), 700);
            anim(ring, [{ transform: "scale(.4)", opacity: 1 }, { transform: "scale(2.4)", opacity: 0 }], { duration: 700, easing: "ease-out" });
            ring.style.transformOrigin = cx(at0) + "px " + cy(at0) + "px";
          }
          break;
        case "trap": K.Sound.play("liar"); break;
        case "bribe": K.Sound.play("score"); break;
      }
    });
    await K.sleep(wait);
  }

  async function perform(a, token) {
    var before = KR.cloneState(G.st), side = G.st.side;
    var ev = KR.apply(G.st, a, []);
    var d = describe(a, ev, before, side);
    G.say = d.html; G.sayCls = d.cls;
    addTrails(ev, side);
    render();
    await effects(ev, before, side);
  }

  /* ---------- Turn flow ---------- */
  function humanTurn() {
    return new Promise(function (resolve) {
      G.resolver = resolve;
      G.busy = false;
      G.undo = [];
      clearSel();
      render();
    });
  }

  async function botTurn(token) {
    var st = G.st;
    G.busy = true;
    G.resolver = null;
    G.say = NAME[st.side] + " is planning…"; G.sayCls = "";
    render();
    await K.sleep(380);
    await waitUnpaused(token);
    await K.frame();
    for (var tries = 0; tries < 4 && G.st.winner == null; tries++) {
      if (token !== G.token) return;
      var plan = KR.bots.plan(G.st, G.level, G.rand);
      var replan = false;
      for (var i = 0; i < plan.length; i++) {
        if (token !== G.token) return;
        if (G.st.winner != null) break;
        await waitUnpaused(token);
        if (token !== G.token) return;
        if (!KR.isLegal(G.st, plan[i])) { replan = true; break; }
        G.st.revealed = false; G.st.drew = false;
        await perform(plan[i], token);
        if (token !== G.token) return;
        await K.sleep(G.cfg.speed === "fast" ? 160 : 460);
        if (G.st.revealed || G.st.drew) { replan = true; break; }
      }
      if (!replan) break;
    }
  }

  async function passCover(side) {
    G.viewer = side;
    G.busy = true;
    buildBoard();
    var cards = G.st.hands[side].length;
    await K.cover({ className: "s" + side, kicker: "Round " + KR.round(G.st), title: NAME[side] + "'s turn", text: "Hand the phone to " + NAME[side] + ". " + NAME[1 - side] + ", no peeking at the " + cards + " cards in " + NAME[side] + "'s hand.", cta: "I'm " + NAME[side] });
  }

  function threatsAtStart() {
    var st = G.st, s = st.side, o = 1 - s;
    var their = st.keys[o].h >= 0 ? KR.unit(st, st.keys[o].h) : null;
    var mine = st.keys[s].h >= 0 ? KR.unit(st, st.keys[s].h) : null;
    if (their && their.side === o && KR.cheb(their.pos, KR.SAFE[s]) <= KR.CFG.crackRange) return "STOP THEM";
    if (mine && mine.side === o && mine.pos === KR.SAFE[o]) return "LAST CHANCE";
    return null;
  }

  async function runGame(token) {
    var local = G.cfg.mode === "local";
    while (G.st.winner == null) {
      if (token !== G.token) return;
      var side = G.st.side;
      G.say = ""; G.sayCls = "";
      if (G.human[side]) {
        if (local) { await passCover(side); if (token !== G.token) return; }
        G.busy = false;
        var alarm = threatsAtStart();
        render();
        if (alarm) { K.Sound.play("ping"); await K.banner(alarm, { tone: "bad", sub: hint().t, ms: 1500 }); }
        else if (!local) { await K.banner("YOUR TURN", { tone: side ? "red" : "blue", ms: 650 }); }
        if (token !== G.token) return;
        await humanTurn();
      } else {
        await botTurn(token);
      }
      if (token !== G.token) return;
      if (G.st.winner != null) break;
      var ev = KR.endTurn(G.st, []);
      if (local && G.st.winner == null) G.trails = G.trails.filter(function (t) { return t.side !== G.st.side; });
      if (!G.human[G.st.side] && !local) G.trails = [];
      if (ev.some(function (e) { return e.e === "crack" || e.e === "stash"; })) break;
    }
    if (token !== G.token) return;
    await endGame(token);
  }

  async function endGame(token) {
    var st = G.st;
    G.busy = true;
    G.resolver = null;
    clearSel();
    if (G.cfg.mode === "local") { G.viewer = st.winner === 1 ? 1 : 0; buildBoard(); }
    G.say = st.reason;
    render();
    var word = st.how === "crack" ? "SAFE CRACKED" : st.how === "stash" ? "KEY STOLEN" : "TIME'S UP";
    await K.banner(word, { tone: st.winner === "draw" ? "accent" : st.winner ? "red" : "blue", sub: st.reason, ms: 1800 });
    if (token !== G.token) return;
    var youWon = G.cfg.mode === "bot" ? st.winner === mySide() : null;
    var s0 = st.stats[0], s1 = st.stats[1];
    var choice = await K.gameOver({
      title: G.cfg.mode === "bot" ? (st.winner === "draw" ? "A draw" : youWon ? "You pulled it off" : "Busted") : (st.winner === "draw" ? "A draw" : NAME[st.winner] + " wins"),
      tone: youWon === false ? "bad" : "good",
      text: st.reason,
      stats: [["Rounds", KR.round(st)], ["Captures (Blue – Red)", s0.caps + " – " + s1.caps], ["Keys stolen", s0.steals + " – " + s1.steals], ["Crew deployed", s0.deploys + " – " + s1.deploys]],
      reviewLabel: "Look at the board"
    });
    if (token !== G.token) return;
    if (choice === "rematch") restart();
    else if (choice === "review") { G.review = true; render(); }
  }

  /* ---------- Crew builder ---------- */
  function presetDeck(id) { var p = KR.PRESETS.filter(function (x) { return x.id === id; })[0] || KR.PRESETS[0]; return { leader: p.leader, crew: p.crew.slice(), gadgets: p.gadgets.slice() }; }

  function chooseDeck(side, opts) {
    return new Promise(function (resolve) {
      var saved = K.store.get("deck" + side, null) || K.store.get("deck0", null);
      var d = KR.validDeck(saved) ? { leader: saved.leader, crew: saved.crew.slice(), gadgets: saved.gadgets.slice() } : presetDeck(side ? "fortress" : "runners");
      var focus = { k: "leader", t: d.leader };
      var host = K.$("#screen-deck");
      function cardBtn(kind, t, on) {
        var cost = kind === "crew" ? T[t].cost : kind === "gadget" ? GD[t].cost : null;
        var name = kind === "gadget" ? GD[t].name : T[t].name;
        return h("button", { class: "card" + (kind === "gadget" ? " gadget" : ""), type: "button", "aria-pressed": on ? "true" : "false", "aria-label": name,
          onclick: function () { toggle(kind, t); } },
          h("span", { class: "tick" }), cost != null ? h("span", { class: "cost" }, String(cost)) : null,
          h("span", { html: iconSvg(t, kind === "gadget" ? "#f2b840" : "#eef2f7") }), h("span", { class: "nm" }, name));
      }
      function toggle(kind, t) {
        K.Sound.play("tap");
        focus = { k: kind, t: t };
        if (kind === "leader") d.leader = t;
        else {
          var list = kind === "crew" ? d.crew : d.gadgets, max = kind === "crew" ? 6 : 2, at = list.indexOf(t);
          if (at >= 0) list.splice(at, 1);
          else if (list.length < max) list.push(t);
          else { list.shift(); list.push(t); }
        }
        draw();
      }
      function done() {
        if (!KR.validDeck(d)) { K.Sound.play("error"); return; }
        K.Sound.play("select");
        K.store.set("deck" + side, d);
        resolve(d);
      }
      function draw() {
        var scroll = host.scrollTop;
        host.innerHTML = "";
        var inner = h("div", { class: "deck-inner" });
        inner.appendChild(h("div", { class: "deck-head" }, h("h2", { class: "s" + side }, opts.title), h("p", null, opts.sub)));
        var pre = h("div", { class: "presets" });
        KR.PRESETS.forEach(function (p) {
          pre.appendChild(h("button", { class: "btn btn-sm", type: "button", title: p.note, onclick: function () { d = presetDeck(p.id); focus = { k: "leader", t: d.leader }; K.Sound.play("tap"); draw(); } }, p.name));
        });
        pre.appendChild(h("button", { class: "btn btn-sm", type: "button", onclick: function () { d = KR.randomDeck(Math.random); focus = { k: "leader", t: d.leader }; K.Sound.play("tap"); draw(); } }, "Random"));
        inner.appendChild(pre);
        function section(label, count, max, grid) {
          inner.appendChild(h("div", null, h("div", { class: "sec-h" }, h("span", null, label), max ? h("b", null, count + " / " + max) : null), grid));
        }
        var lg = h("div", { class: "pick lead" });
        KR.LEADERS.forEach(function (t) { lg.appendChild(cardBtn("leader", t, d.leader === t)); });
        section("Leader", null, null, lg);
        var cg = h("div", { class: "pick" });
        KR.CREW.forEach(function (t) { cg.appendChild(cardBtn("crew", t, d.crew.indexOf(t) >= 0)); });
        section("Crew", d.crew.length, 6, cg);
        var gg = h("div", { class: "pick gad" });
        KR.GADGET_LIST.forEach(function (t) { gg.appendChild(cardBtn("gadget", t, d.gadgets.indexOf(t) >= 0)); });
        section("Gadgets", d.gadgets.length, 2, gg);
        var info;
        if (focus.k === "gadget") info = cardInfo({ k: "gadget", t: focus.t });
        else if (focus.k === "crew") info = cardInfo({ k: "crew", t: focus.t });
        else {
          var L = T[focus.t];
          info = h("div", { class: "info" }, h("span", { class: "badge s" + side, html: iconSvg(focus.t, "#fff") }),
            h("div", { class: "txt" }, h("div", { class: "nm" }, h("b", null, L.name), h("span", { class: "tag" }, "leader · starts with your key")),
              h("p", { html: "<b>" + L.pname + ":</b> " + L.ptext }), h("p", { html: "<b>" + L.aname + " (" + L.ac + "):</b> " + L.atext })));
        }
        var ok = KR.validDeck(d);
        var detail = h("div", { class: "detail" }, info, h("div", { class: "row" },
          h("button", { class: "btn", type: "button", onclick: function () { K.Sound.play("tap"); K.quit(); } }, "Back"),
          h("button", { class: "btn btn-primary", type: "button", id: "btn-ready", disabled: ok ? null : true, onclick: done }, ok ? opts.cta : "Pick " + (6 - d.crew.length > 0 ? 6 - d.crew.length + " more crew" : 2 - d.gadgets.length + " more gadget" + (2 - d.gadgets.length === 1 ? "" : "s")))));
        inner.appendChild(detail);
        host.appendChild(inner);
        host.scrollTop = scroll;
      }
      K.showScreen("deck");
      host.scrollTop = 0;
      draw();
    });
  }

  /* ---------- Lifecycle ---------- */
  async function start(cfg) {
    G.cfg = cfg;
    G.level = cfg.difficulty || "normal";
    var token = ++G.token;
    if (cfg.mode === "local") {
      G.human = [true, true];
      var d0 = await chooseDeck(0, { title: "Blue crew", sub: "Blue picks a leader, 6 crew and 2 gadgets. Red, look away.", cta: "Blue is ready" });
      if (token !== G.token) return;
      await K.cover({ className: "s1", kicker: "Crew select", title: "Red's pick", text: "Hand the phone to Red.", cta: "I'm Red" });
      if (token !== G.token) return;
      var d1 = await chooseDeck(1, { title: "Red crew", sub: "Red picks a leader, 6 crew and 2 gadgets.", cta: "Red is ready" });
      if (token !== G.token) return;
      G.decks = [d0, d1];
    } else {
      var me = cfg.side === "red" ? 1 : 0;
      G.human = [me === 0, me === 1];
      var dh = await chooseDeck(me, { title: "Your crew", sub: "Pick a leader, 6 crew and 2 gadgets, or start from a ready-made crew.", cta: "Start the heist" });
      if (token !== G.token) return;
      var p = KR.PRESETS[Math.floor(Math.random() * KR.PRESETS.length)];
      var db = { leader: p.leader, crew: p.crew.slice(), gadgets: p.gadgets.slice() };
      G.decks = me === 0 ? [dh, db] : [db, dh];
    }
    newMatch();
  }

  function newMatch() {
    G.token++;
    G.st = KR.newGame({ decks: G.decks, seed: (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0 });
    G.rand = KR.rng((Date.now() * 7 + Math.floor(Math.random() * 1e6)) >>> 0);
    G.viewer = G.cfg.mode === "local" ? 0 : mySide();
    G.review = false; G.trails = []; G.say = ""; G.sayCls = ""; G.undo = []; G.resolver = null; G.busy = true;
    clearSel();
    K.showScreen("game");
    buildBoard();
    render();
    runGame(G.token);
  }
  function restart() { K.$all(".cover,.modal-wrap,.banner").forEach(function (n) { n.remove(); }); newMatch(); }
  function quit() { G.token++; G.resolver = null; G.busy = true; }

  window.__krDebug = { G: G, KR: KR, doHuman: doHuman, endTurn: endTurnClicked };

  K.init({
    ns: "keyrunners",
    title: "Keyrunners",
    tagline: "Run your key into their safe. Lose it, and they lock it away.",
    art: TITLE_ART,
    rules: RULES.replace("[[glossary]]", glossary()),
    options: [
      { id: "mode", label: "Opponent", default: "bot", choices: [{ v: "bot", t: "Bot" }, { v: "local", t: "Friend, same phone" }],
        note: function (c) { return c.mode === "local" ? "Cover screens hide each player's hand and traps between turns." : null; } },
      { id: "difficulty", label: "Bot level", default: "normal", choices: [{ v: "easy", t: "Easy" }, { v: "normal", t: "Normal" }, { v: "hard", t: "Hard" }], showIf: function (c) { return c.mode === "bot"; },
        note: function (c) { return c.difficulty === "hard" ? "Plans its turn and checks your best reply before it commits." : c.difficulty === "easy" ? "Often forgets to guard its key." : "Guards its key and punishes a lonely carrier."; } },
      { id: "side", label: "You play", default: "blue", choices: [{ v: "blue", t: "Blue, first" }, { v: "red", t: "Red, second" }], showIf: function (c) { return c.mode === "bot"; } },
      { id: "speed", label: "Bot speed", default: "normal", choices: [{ v: "normal", t: "Watch each move" }, { v: "fast", t: "Fast" }], showIf: function (c) { return c.mode === "bot"; } }
    ],
    onStart: start,
    onRestart: restart,
    onQuit: quit,
    menuNote: function () { return G.st ? "Round " + KR.round(G.st) + ". Blue " + G.st.mana[0] + " mana, Red " + G.st.mana[1] + " mana." : "Pick your crew to start."; }
  });
  // Opening the menu pauses the bot between moves.
  var menuBtn = K.$("#btn-menu");
  if (menuBtn) menuBtn.onclick = function () {
    K.Sound.play("tap");
    G.paused = true;
    K.openMenu().then(function () { G.paused = false; }, function () { G.paused = false; });
  };
})();

</script>
</body>
</html>
