# Build, GameTests, datagen no-diff and the content-bible check (D-019, WP-033).
name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and run GameTests
        run: ./gradlew build --console=plain

      - name: Content bible check
        run: python3 tools/docs/check_bible.py

      - name: Datagen no-diff check
        run: tools/dev/datagen.sh --check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thesift-jar
          path: build/libs/*.jar
          if-no-files-found: ignore
